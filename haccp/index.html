<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HACCP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Huisstijl Zusje-app: zelfde opzet, alleen andere kleuren.
       --oranje/--blauw houden hun naam zodat de rest van de opmaak klopt. */
    --oranje:#c8a45b; --oranje-dim:rgba(200,164,91,.14);
    --blauw:#f0d28a; --grijs:#0b0906; --lijn:rgba(200,164,91,.3);
    --tekst:#f5f1e8; --zacht:#b8b0a0;
    --groen:#22c55e; --rood:#ef4444;
    --vlak:#151009; --vlak-2:#191309; --veld:rgba(0,0,0,.35);
    --grad-gold:linear-gradient(180deg,#f4dc9c 0%,#d9b26a 55%,#c8a45b 100%);
    --radius:10px;
    --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--tekst);-webkit-font-smoothing:antialiased;
       background:
         radial-gradient(ellipse 90% 40% at 50% -5%, rgba(200,164,91,.10), transparent 60%),
         linear-gradient(180deg,#0d0a07 0%,#0b0906 100%);
       background-attachment:fixed;
       font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
  /* knoppen erven de tekstkleur; anders vallen ze weg op de donkere ondergrond */
  button{font-family:inherit;font-size:inherit;color:inherit}

  /* ---------- kop ---------- */
  header{background:var(--vlak);border-bottom:1px solid var(--lijn);position:sticky;top:0;z-index:20}
  .kop{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .merk{font-weight:700;font-size:17px;color:var(--tekst);letter-spacing:.2px}
  .merk span{color:var(--oranje)}
  .kop-rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
  .mw{background:var(--oranje-dim);color:var(--blauw);border:1px solid var(--lijn);
      padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
  .knop-tekst{background:none;border:0;color:var(--zacht);cursor:pointer;font-size:13px;text-decoration:underline}

  main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
  h1{font-size:26px;margin:4px 0 18px;color:var(--blauw)}

  /* ---------- tellers ---------- */
  .tellers{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .teller{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--radius);
          padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .teller small{display:block;color:var(--zacht);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .teller b{font-size:26px;line-height:1}
  .bal{min-width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
       font-weight:700;font-size:15px;color:#241a0c;padding:0 8px}
  .bal.oranje{background:var(--grad-gold)} .bal.blauw{background:var(--blauw)}
  .bal.leeg{background:rgba(255,255,255,.14);color:var(--tekst)}

  /* ---------- indeling ---------- */
  .grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .cats{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--radius);overflow:hidden}
  .cat{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;background:none;
       width:100%;text-align:left;cursor:pointer;border-left:4px solid transparent;border-bottom:1px solid var(--lijn)}
  .cat:last-child{border-bottom:0}
  .cat:hover{background:rgba(200,164,91,.08)}
  .cat.actief{background:var(--oranje-dim);border-left-color:var(--oranje)}
  .cat.actief .nm{color:var(--blauw)}
  .cat .ic{font-size:17px;width:22px;text-align:center}
  .cat .nm{flex:1;font-size:14px;font-weight:600}
  .cat .bal{min-width:28px;height:28px;font-size:13px}

  .paneel{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--radius);overflow:hidden}
  .paneel-kop{padding:12px 14px;border-bottom:1px solid var(--lijn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tab{border:1px solid var(--lijn);background:var(--vlak-2);border-radius:99px;padding:5px 14px;
       cursor:pointer;font-size:13px;font-weight:600;color:var(--zacht)}
  .tab.actief{background:var(--grad-gold);border-color:transparent;color:#241a0c}

  table{width:100%;border-collapse:collapse}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--zacht);
     text-align:left;padding:10px 14px;border-bottom:1px solid var(--lijn);font-weight:600}
  td{padding:11px 14px;border-bottom:1px solid var(--lijn);font-size:14px;vertical-align:top}
  tr.rij{cursor:pointer}
  tr.rij:hover td{background:rgba(200,164,91,.08)}
  tr.rij.klaar td{color:var(--zacht)}
  .afd{color:var(--zacht);font-size:13px}
  .vink{color:var(--groen);font-weight:700}
  .leeg-melding{padding:26px 14px;color:var(--zacht);text-align:center}
  @media(max-width:600px){th:nth-child(2),td:nth-child(2){display:none}}

  /* ---------- dialoog ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;
           align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;z-index:50}
  .overlay[hidden]{display:none}
  .dlg{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--radius);max-width:560px;width:100%;
       box-shadow:0 12px 40px rgba(0,0,0,.6);margin:auto}
  .dlg-kop{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--lijn)}
  .dlg-kop h2{font-size:14px;margin:0;font-weight:600;flex:1}
  .sluit{border:0;background:none;font-size:22px;line-height:1;color:var(--zacht);cursor:pointer;padding:0 4px}
  .dlg-body{padding:18px 16px}
  .dlg-voet{padding:12px 16px;border-top:1px solid var(--lijn);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

  .taaktitel{color:var(--oranje);font-weight:700;font-size:15px;margin:0 0 2px}
  .taakafd{color:var(--zacht);font-size:13px;margin:0 0 12px}
  .instructie{background:var(--oranje-dim);color:#f6e3b4;border-left:3px solid var(--oranje);padding:9px 12px;
              border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 16px}
  .kopje{font-weight:700;font-size:13px;margin:18px 0 8px;color:var(--tekst)}
  label.veld{display:block;margin-bottom:14px}
  label.veld .lbl{display:block;font-size:13px;color:var(--zacht);margin-bottom:4px}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--lijn);border-radius:6px;
    font-family:inherit;font-size:15px;background:var(--veld);color:var(--tekst)}
  input.kort{max-width:150px}
  textarea{min-height:74px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--oranje);outline-offset:-1px;border-color:var(--oranje)}
  .buiten-norm{border-color:var(--rood)!important;background:rgba(239,68,68,.12)}
  .norm-waarschuwing{color:var(--rood);font-size:12.5px;font-weight:600;margin-top:4px}
  .norm-ok{color:var(--groen);font-size:12.5px;font-weight:600;margin-top:4px}

  .schakel{display:flex;align-items:center;gap:10px;margin:0 0 16px;cursor:pointer;font-size:14px}
  .schakel input{position:absolute;opacity:0;width:0;height:0}
  .spoor{width:42px;height:23px;border-radius:99px;background:rgba(255,255,255,.16);position:relative;transition:background .15s;flex:none}
  .spoor::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
                background:#f5f1e8;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .schakel input:checked + .spoor{background:var(--oranje)}
  .schakel input:checked + .spoor::after{transform:translateX(19px)}

  .beoordeling-rij{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--lijn)}
  .beoordeling-rij span{flex:1;font-size:14px}
  .duim{border:1px solid var(--lijn);background:var(--veld);border-radius:6px;width:42px;height:34px;
        cursor:pointer;font-size:17px;line-height:1}
  .duim.op.aan{background:rgba(34,197,94,.2);border-color:var(--groen)}
  .duim.neer.aan{background:rgba(239,68,68,.2);border-color:var(--rood)}

  .keuzes{display:flex;gap:10px;flex-wrap:wrap}
  .keuze{border:1px solid var(--lijn);background:var(--veld);color:var(--tekst);border-radius:99px;padding:8px 18px;cursor:pointer;font-size:14px}
  .keuze.aan{background:var(--grad-gold);border-color:transparent;color:#241a0c;font-weight:700}

  .btn{border:0;border-radius:6px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:14px}
  .btn.primair{background:var(--grad-gold);color:#241a0c}
  .btn.grijs{background:rgba(255,255,255,.08);color:var(--tekst)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .let-op{color:var(--oranje);font-size:12.5px;text-align:center;margin:14px 0 0}

  .hist-rij{border-bottom:1px solid var(--lijn);padding:10px 0;font-size:13.5px}
  .hist-rij b{display:block;font-size:14px}
  .hist-meta{color:var(--zacht);font-size:12.5px}
  .hist-detail{margin-top:4px}

  .sync{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;
        border:1px solid var(--lijn);color:var(--zacht);background:var(--vlak-2);white-space:nowrap}
  .sync.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#c9f2d6}
  .sync.wacht{background:var(--oranje-dim);border-color:var(--lijn);color:#f6e3b4}
  .sync.uit{background:rgba(255,255,255,.06)}
  .hint{font-size:12.5px;color:var(--zacht);margin:-8px 0 16px}
  .hint a{color:var(--oranje)}
  .melding{font-size:13px;font-weight:600;margin:10px 0 0}
  .melding.goed{color:var(--groen)} .melding.fout{color:var(--rood)}

  /* ---------- titel + spreadsheetknop ---------- */
  .titelrij{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
  .titelrij h1{margin:0}
  .knop-sheet{display:inline-flex;align-items:center;gap:6px;background:var(--grad-gold);color:#241a0c;
    text-decoration:none;font-weight:700;font-size:14px;padding:10px 18px;border-radius:99px;
    box-shadow:0 6px 18px -6px rgba(200,164,91,.5),inset 0 1px 0 rgba(255,255,255,.5);transition:filter .15s,transform .15s}
  .knop-sheet:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .knop-sheet:active{transform:scale(.97)}
</style>
</head>
<body>

<main>
  <div class="titelrij">
    <h1>Taken uitvoeren</h1>
    <a class="knop-sheet" href="https://docs.google.com/spreadsheets/d/1-Vy5ebrcC8FM9-zetaa3zq7pkBv0yw2BFIBzbY3DMhI/edit"
       target="_blank" rel="noopener">Registratie historie &#8599;</a>
  </div>

  <div class="tellers">
    <div class="teller"><div><small>Openstaand vandaag</small><b id="tVandaag">0</b></div><div class="bal oranje" id="bVandaag">0</div></div>
    <div class="teller"><div><small>Openstaand deze week</small><b id="tWeek">0</b></div><div class="bal blauw" id="bWeek">0</div></div>
    <div class="teller"><div><small>Afgerond vandaag</small><b id="tKlaar">0</b></div><div class="bal leeg" id="bKlaar">0</div></div>
    <div class="teller"><div><small>Week</small><b id="tWeeknr">–</b></div><div class="bal leeg" id="bDatum">–</div></div>
  </div>

  <div class="grid">
    <div class="cats" id="cats"></div>
    <div class="paneel">
      <div class="paneel-kop">
        <button class="tab actief" data-bereik="vandaag" id="tabVandaag">Vandaag: <b>0</b></button>
        <button class="tab" data-bereik="week" id="tabWeek">Deze week: <b>0</b></button>
        <button class="tab" data-bereik="alle" id="tabAlle">Alle taken</button>
      </div>
      <div id="lijst"></div>
    </div>
  </div>
</main>

<!-- registratie -->
<div class="overlay" id="ovTaak" hidden>
  <div class="dlg">
    <div class="dlg-kop"><h2>Registreren uitgevoerde taak</h2><button class="sluit" data-sluit="ovTaak">×</button></div>
    <div class="dlg-body" id="taakBody"></div>
    <div class="dlg-voet">
      <button class="btn grijs" data-sluit="ovTaak">Pagina sluiten</button>
      <button class="btn primair" id="btnOpslaan">Opslaan en sluiten</button>
    </div>
  </div>
</div>



<script src="instellingen.js"></script>
<script src="taken.js"></script>
<script src="app.js"></script>
</body>
</html>
