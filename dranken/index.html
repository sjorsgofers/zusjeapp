<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Drankenkaart</title>

<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drankenkaart">
<meta name="application-name" content="Drankenkaart">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">

<style>
:root{ --gold:#c8a45b; --bg:#111111; --bg2:#0b0b0b; }
html,body{margin:0;padding:0;background:var(--bg);color:#ffffff}
#dk-app,#dk-app *,#dk-app *::before,#dk-app *::after{
  box-sizing:border-box !important;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif !important;
  letter-spacing:normal !important;
  line-height:1.45 !important;
  color:#ffffff !important;
}
#dk-app{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1180px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom))}

.lang{display:inline-flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{border:0;background:transparent;color:#ffffff !important;font-size:13px;font-weight:600;padding:9px 14px;cursor:pointer}
.lang button.active{background:var(--gold);color:#0b0b0b !important}

/* Search */
.search-row{display:flex;gap:10px;align-items:center;margin:0;flex:0 0 auto}
.search{flex:1;min-width:0;min-height:48px;border:1px solid var(--gold);border-radius:28px;padding:0 20px;font-size:16px;outline:none;background:var(--bg);color:#ffffff}
.search::placeholder{color:#ffffff !important;opacity:.55}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,91,.18)}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0;flex:0 0 auto}
.tab{min-height:40px;padding:0 16px;border:1px solid var(--gold);border-radius:24px;background:var(--bg);color:#ffffff !important;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s ease}
.tab .count{font-size:12px;opacity:.65;font-weight:500}
.tab:hover{background:#1a1a1a}
.tab.active{background:var(--gold);color:#0b0b0b !important}
.tab.active *{color:#0b0b0b !important}

/* Tiles — grid fills remaining height; JS sets column count so all tiles fit on screen */
.grid{display:grid;gap:8px;flex:1 1 auto;min-height:0;align-content:start;overflow-y:auto;overflow-x:hidden;grid-template-columns:repeat(4,minmax(0,1fr))}
/* Block layout (NOT flex): Safari renders flex/grid on <button> incorrectly,
   which collapsed the image and hid the titles. Normal block flow stacks the
   image and the text body reliably in every browser. */
.tile{border:1px solid var(--gold);border-radius:14px;background:var(--bg);overflow:hidden;cursor:pointer;text-align:left;display:block;padding:0;margin:0;-webkit-appearance:none;appearance:none;font:inherit;color:inherit;transition:transform .12s ease, box-shadow .15s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(200,164,91,.16)}
.tile:active{transform:translateY(0)}
/* Square image via padding-hack (robust on iOS Safari, where aspect-ratio on <img> is unreliable) */
.tile-imgwrap{position:relative;width:100%;padding-top:100%;height:0;overflow:hidden;background:#0b0b0b;flex:0 0 auto}
.tile-img{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;display:block}
.tile-body{padding:7px 10px 9px;display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.tile-cat{margin:0;font-size:9.5px;color:var(--gold) !important;text-transform:uppercase;letter-spacing:.5px !important;font-weight:600}
.tile-name{margin:0;font-size:13px;font-weight:600;line-height:1.2 !important;min-height:2.4em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-meta{margin:0;font-size:11px;color:#ffffff !important;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-meta.wine{color:var(--gold) !important;opacity:.85;font-weight:600}

.empty{grid-column:1/-1;border:1px dashed var(--gold);border-radius:16px;padding:32px 16px;text-align:center;color:#ffffff !important;opacity:.8}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;opacity:0;pointer-events:none;transition:opacity .16s ease}
.overlay.open{opacity:1;pointer-events:auto}
.modal{position:relative;width:100%;max-width:960px;max-height:92dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--gold);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:translateY(12px) scale(.98);transition:transform .18s ease}
.overlay.open .modal{transform:translateY(0) scale(1)}
.modal-hero{position:relative}
.modal-hero img{width:100%;height:clamp(190px,32vh,300px);object-fit:cover;display:block;background:#0b0b0b}
.modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(17,17,17,1) 2%, rgba(17,17,17,0) 45%);pointer-events:none}
.close{position:absolute;top:12px;right:12px;width:38px;height:38px;border:1px solid var(--gold);background:rgba(11,11,11,.72);border-radius:999px;color:var(--gold) !important;font-size:22px;line-height:1 !important;cursor:pointer;display:grid;place-items:center;z-index:3}

/* Wide screens: two columns (photo left, steps right) — uses the screen width
   and greatly reduces scrolling. */
@media (min-width:760px){
  .modal{max-width:960px;max-height:86dvh;overflow:hidden;display:grid;grid-template-columns:minmax(300px,38%) 1fr;grid-template-rows:auto 1fr}
  .modal-hero{grid-column:1;grid-row:1 / span 2;height:100%;overflow:hidden}
  .modal-hero img{height:100%;min-height:100%}
  .modal-hero::after{display:none}
  .modal-head{grid-column:2;grid-row:1;margin-top:0 !important;padding:22px 28px 10px !important}
  .modal-body{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;padding:6px 28px 26px !important}
}
.close:hover{background:#1a1a1a}
.modal-head{padding:4px 22px 12px;margin-top:-6px;position:relative;z-index:1}
.modal-cat{margin:0 0 4px;font-size:11px;color:var(--gold) !important;text-transform:uppercase;letter-spacing:.6px !important;font-weight:600}
.modal-title{margin:0;font-size:22px;font-weight:600;line-height:1.25 !important}
/* Variant toggle (glass / bottle) */
.vtoggle{display:none;margin:14px 0 2px;border:1px solid var(--gold);border-radius:999px;overflow:hidden;width:fit-content}
.vtoggle.show{display:inline-flex}
.vtoggle button{border:0;background:transparent;color:#ffffff !important;font-size:13px;font-weight:600;padding:8px 20px;cursor:pointer}
.vtoggle button.active{background:var(--gold);color:#0b0b0b !important}
.modal-body{padding:8px 22px 26px}
.prep-label{margin:0 0 12px;font-size:12px;color:#ffffff !important;opacity:.6;text-transform:uppercase;letter-spacing:.5px !important;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:step}
.steps li{position:relative;padding-left:44px;font-size:15px;min-height:30px;display:flex;align-items:center}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:999px;background:var(--gold);color:#0b0b0b !important;font-weight:700;font-size:14px;display:grid;place-items:center}

.hidden{display:none !important}

@media (max-width:640px){
  .wrap{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .grid{gap:7px}
  .tile-body{padding:6px 8px 8px}
  .tile-name{font-size:12px}
  .tab{min-height:36px;padding:0 12px;font-size:12.5px}
  .modal-head{padding:4px 18px 10px}
  .modal-body{padding:8px 18px 22px}
  .modal-title{font-size:20px}
}

/* Login gate */
#loginGate{min-height:100vh;background:var(--bg2);display:flex;align-items:center;justify-content:center;padding:24px}
.login-shell{width:100%;max-width:520px}
.login-card{border:1px solid var(--gold);background:var(--bg2);border-radius:24px;padding:28px 24px;box-shadow:0 14px 42px rgba(200,164,91,.12);text-align:center}
.login-logo{width:140px;max-width:42vw;display:block;margin:0 auto 18px}
.login-title{margin:0 0 18px;color:#ffffff !important;font-size:28px;font-weight:600}
.login-row{display:flex;gap:10px;align-items:center}
.login-input{flex:1;min-height:56px;border:1px solid var(--gold);border-radius:28px;padding:0 20px;font-size:16px;outline:none;background:var(--bg);color:#ffffff !important;box-shadow:0 8px 24px rgba(200,164,91,.12)}
.login-input::placeholder{color:#ffffff !important;opacity:.7}
.login-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,91,.18), 0 8px 24px rgba(200,164,91,.18)}
.login-btn{min-height:56px;padding:0 18px;border:1px solid var(--gold);border-radius:28px;background:var(--bg2);color:#ffffff !important;font-size:15px;font-weight:600;cursor:pointer}
.login-error{margin:12px 0 0;color:#ffffff !important;font-size:13px}
@media (max-width:640px){
  .login-card{padding:22px 18px;border-radius:20px}
  .login-title{font-size:24px}
  .login-row{flex-direction:column}
  .login-input,.login-btn{width:100%}
}
</style>
</head>

<body>
<div id="protectedApp">
<div id="dk-app">
  <div class="wrap">
    <div class="search-row">
      <input id="q" class="search" type="text" aria-label="Zoek een drankje">
      <div class="lang" role="group" aria-label="Taal / Language">
        <button id="langNL" type="button" data-lang="nl">NL</button>
        <button id="langEN" type="button" data-lang="en">EN</button>
        <button id="langDE" type="button" data-lang="de">DE</button>
      </div>
    </div>

    <nav id="tabs" class="tabs" aria-label="Categorieën"></nav>

    <div id="grid" class="grid"></div>
  </div>
</div>
</div>

<!-- Modal -->
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <button id="modalClose" class="close" type="button" aria-label="Sluiten">×</button>
    <div class="modal-hero">
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-head">
      <p id="modalCat" class="modal-cat"></p>
      <h2 id="modalTitle" class="modal-title"></h2>
      <div id="variantToggle" class="vtoggle" role="group" aria-label="Glas of fles">
        <button type="button" data-v="glas"></button>
        <button type="button" data-v="fles"></button>
      </div>
    </div>
    <div class="modal-body">
      <p id="prepLabel" class="prep-label"></p>
      <ol id="modalSteps" class="steps"></ol>
    </div>
  </div>
</div>

<script>
const CAT_ORDER = ["Fris","Cocktails","Bier","Wijn","Sterke drank","Koffie en thee"];
const CAT_EN = {
  "Fris":"Soft drinks","Cocktails":"Cocktails","Bier":"Beer",
  "Wijn":"Wine","Sterke drank":"Spirits","Koffie en thee":"Coffee & tea"
};
const CAT_DE = {
  "Fris":"Softdrinks","Cocktails":"Cocktails","Bier":"Bier",
  "Wijn":"Wein","Sterke drank":"Spirituosen","Koffie en thee":"Kaffee & Tee"
};
const T = {
  nl:{ placeholder:"Zoek een drankje…",
       prep:"Bereidingswijze", step:"stap", steps:"stappen", glas:"Glas", fles:"Fles",
       empty:"Geen drankjes gevonden", emptyFor:"Geen drankjes gevonden voor" },
  en:{ placeholder:"Search a drink…",
       prep:"Preparation", step:"step", steps:"steps", glas:"Glass", fles:"Bottle",
       empty:"No drinks found", emptyFor:"No drinks found for" },
  de:{ placeholder:"Getränk suchen…",
       prep:"Zubereitung", step:"Schritt", steps:"Schritte", glas:"Glas", fles:"Flasche",
       empty:"Keine Getränke gefunden", emptyFor:"Keine Getränke gefunden für" }
};

let DATA = [];
let DISPLAY = [];
let activeCat = CAT_ORDER[0];
let query = "";
let lang = localStorage.getItem("zusje_dranken_lang") || "nl";
let currentItem = null;      // display item shown in modal
let currentVariant = null;   // 'glas' | 'fles' | 'single'

fetch("data.json")
  .then(r => r.json())
  .then(d => { DATA = d; buildDisplay(); applyLang(); buildTabs(); render(); })
  .catch(e => { console.error("Kon data.json niet laden:", e); });

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalize(str){
  return (str||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
}
function normKey(str){
  return normalize(str).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function catLabel(cat){ return lang==="en" ? CAT_EN[cat] : lang==="de" ? CAT_DE[cat] : cat; }

// Build display items: wines grouped into one item with glas/fles variants; everything else single.
function buildDisplay(){
  DISPLAY = [];
  const wineGroups = new Map();
  for (const d of DATA){
    if (d.category === "Wijn"){
      let vtype = "fles", base = d.name, base_en = d.name_en, base_de = d.name_de;
      if (d.name.startsWith("Glas ")){ vtype="glas"; base=d.name.slice(5); }
      else if (d.name.startsWith("Fles ")){ vtype="fles"; base=d.name.slice(5); }
      if (d.name_en.startsWith("Glass of ")) base_en=d.name_en.slice(9);
      else if (d.name_en.startsWith("Bottle of ")) base_en=d.name_en.slice(10);
      if (d.name_de.startsWith("Glas ")) base_de=d.name_de.slice(5);
      else if (d.name_de.startsWith("Flasche ")) base_de=d.name_de.slice(8);
      const key = normKey(base);
      let item = wineGroups.get(key);
      if (!item){
        item = { category:"Wijn", isWine:true, name:base, name_en:base_en, name_de:base_de, variants:{} };
        wineGroups.set(key, item);
        DISPLAY.push(item);
      }
      item.variants[vtype] = d;
    } else {
      DISPLAY.push({ category:d.category, isWine:false, name:d.name, name_en:d.name_en, name_de:d.name_de, variants:{ single:d } });
    }
  }
}

function itemName(item){ return lang==="en" ? item.name_en : lang==="de" ? item.name_de : item.name; }
function defaultVariant(item){
  return item.variants.glas ? "glas" : (item.variants.fles ? "fles" : "single");
}
function variantDrink(item, v){ return item.variants[v]; }
function drinkSteps(d){ return lang==="en" ? d.steps_en : lang==="de" ? d.steps_de : d.steps; }

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("langNL").classList.toggle("active", lang==="nl");
  document.getElementById("langEN").classList.toggle("active", lang==="en");
  document.getElementById("langDE").classList.toggle("active", lang==="de");
  document.getElementById("q").placeholder = T[lang].placeholder;
  document.getElementById("prepLabel").textContent = T[lang].prep;
  const vt = document.getElementById("variantToggle");
  vt.querySelector('[data-v="glas"]').textContent = T[lang].glas;
  vt.querySelector('[data-v="fles"]').textContent = T[lang].fles;
}

function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = CAT_ORDER.map(cat => {
    const n = DISPLAY.filter(it => it.category === cat).length;
    return `<button class="tab${cat===activeCat?' active':''}" type="button" data-cat="${escapeHtml(cat)}">
      <span class="lbl">${escapeHtml(catLabel(cat))}</span> <span class="count">${n}</span>
    </button>`;
  }).join("");
  tabsEl.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("click", () => {
      activeCat = b.dataset.cat;
      tabsEl.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.cat===activeCat));
      render();
    });
  });
}

function itemMatches(item, q){
  if (normalize(item.name).includes(q) || normalize(item.name_en).includes(q) || normalize(item.name_de).includes(q)) return true;
  return Object.values(item.variants).some(d =>
    normalize(d.name).includes(q) || normalize(d.name_en).includes(q) || normalize(d.name_de).includes(q));
}

function render(){
  const gridEl = document.getElementById("grid");
  const q = normalize(query);
  let list = q ? DISPLAY.filter(it => itemMatches(it, q))
               : DISPLAY.filter(it => it.category === activeCat);

  if (!list.length){
    const msg = q ? `${T[lang].emptyFor} “${escapeHtml(query)}”.` : `${T[lang].empty}.`;
    gridEl.style.gridTemplateColumns = "1fr";
    gridEl.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  gridEl.innerHTML = list.map(item => {
    const idx = DISPLAY.indexOf(item);
    const v0 = defaultVariant(item);
    const d0 = variantDrink(item, v0);
    const showCat = q ? `<p class="tile-cat">${escapeHtml(catLabel(item.category))}</p>` : '';
    return `<button class="tile" type="button" onclick="openModal(${idx})">
      <div class="tile-imgwrap"><img class="tile-img" src="${escapeHtml(d0.img)}" alt="${escapeHtml(itemName(item))}" loading="lazy"></div>
      <div class="tile-body">
        ${showCat}
        <p class="tile-name">${escapeHtml(itemName(item))}</p>
      </div>
    </button>`;
  }).join("");
  scheduleFit();
}

// Fit all tiles of the active view into the visible grid area by choosing the
// smallest number of columns (= largest tiles) that still fits vertically.
let fitScheduled = false;
function scheduleFit(){
  if (fitScheduled) return;
  fitScheduled = true;
  requestAnimationFrame(() => { fitScheduled = false; fitGrid(); });
}
function fitGrid(){
  const grid = document.getElementById("grid");
  const tiles = grid.querySelectorAll(".tile");
  const n = tiles.length;
  if (!n) return;
  const availH = grid.clientHeight;
  const availW = grid.clientWidth;
  if (availH <= 0 || availW <= 0) return;   // hidden / not laid out yet
  const gap = parseFloat(getComputedStyle(grid).columnGap) || 8;
  const border = 2;                         // tile border top+bottom
  // Enforce a minimum readable tile width, so we never cram tiny columns on a
  // phone (which would cut the titles). This caps the column count; when all
  // tiles don't fit at that size the grid simply scrolls vertically.
  const minCol = availW < 480 ? 108 : 155;
  const maxCols = Math.max(1, Math.min(n, Math.floor((availW + gap) / (minCol + gap))));
  // Within that cap, choose the fewest columns (largest tiles) that still fit
  // the height. The tile image is square, so tile height ≈ column width + text
  // body height; body height is MEASURED per candidate (long titles wrap to 2
  // lines on narrow tiles, so estimating it would clip them).
  let chosen = maxCols;
  for (let c = 1; c <= maxCols; c++){
    grid.style.gridTemplateColumns = `repeat(${c},minmax(0,1fr))`;
    const colW = (availW - (c - 1) * gap) / c;
    let bodyH = 0;
    tiles.forEach(t => {
      const b = t.querySelector(".tile-body");
      if (b) bodyH = Math.max(bodyH, b.getBoundingClientRect().height);
    });
    if (!bodyH || bodyH < 20) bodyH = 52;
    const tileH = colW + bodyH + border;    // square image + text body
    const rows = Math.ceil(n / c);
    const totalH = rows * tileH + (rows - 1) * gap;
    if (totalH <= availH){ chosen = c; break; }
    chosen = c;
  }
  grid.style.gridTemplateColumns = `repeat(${chosen},minmax(0,1fr))`;
}
window.addEventListener("resize", scheduleFit);
window.addEventListener("orientationchange", scheduleFit);
if (window.ResizeObserver){
  new ResizeObserver(scheduleFit).observe(document.documentElement);
}

function renderVariant(){
  const item = currentItem;
  const d = variantDrink(item, currentVariant);
  document.getElementById("modalImg").src = d.img;
  document.getElementById("modalImg").alt = itemName(item);
  document.getElementById("modalSteps").innerHTML = drinkSteps(d).map(s => `<li>${escapeHtml(s)}</li>`).join("");
  const vt = document.getElementById("variantToggle");
  vt.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.v===currentVariant));
}

function openModal(idx){
  const item = DISPLAY[idx];
  if (!item) return;
  currentItem = item;
  document.getElementById("modalCat").textContent = catLabel(item.category);
  document.getElementById("modalTitle").textContent = itemName(item);
  document.getElementById("prepLabel").textContent = T[lang].prep;

  const vt = document.getElementById("variantToggle");
  const hasBoth = item.isWine && item.variants.glas && item.variants.fles;
  vt.classList.toggle("show", !!hasBoth);
  currentVariant = defaultVariant(item);   // glass by default
  renderVariant();

  const ov = document.getElementById("overlay");
  ov.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
  currentItem = null; currentVariant = null;
}

function setLang(l){
  lang = l;
  localStorage.setItem("zusje_dranken_lang", l);
  applyLang();
  buildTabs();
  render();
  if (currentItem){
    document.getElementById("modalCat").textContent = catLabel(currentItem.category);
    document.getElementById("modalTitle").textContent = itemName(currentItem);
    renderVariant();
  }
}

document.getElementById("langNL").addEventListener("click", () => setLang("nl"));
document.getElementById("langEN").addEventListener("click", () => setLang("en"));
document.getElementById("langDE").addEventListener("click", () => setLang("de"));
document.getElementById("variantToggle").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !currentItem) return;
  currentVariant = b.dataset.v; renderVariant();
});
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
</script>

</body>
</html>
