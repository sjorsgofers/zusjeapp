<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Drankenkaart</title>

<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drankenkaart">
<meta name="application-name" content="Drankenkaart">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">

<style>
:root{ --gold:#c8a45b; --gold-bright:#f0d28a; --bg:#0b0906; --bg2:#080604;
  --line:rgba(200,164,91,.28); --line-strong:rgba(200,164,91,.55);
  --grad-gold:linear-gradient(180deg,#f4dc9c 0%,#d9b26a 55%,#c8a45b 100%);
  --ease:cubic-bezier(.4,0,.2,1); }
html,body{margin:0;padding:0;background:var(--bg);color:#f5f1e8}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 90% 55% at 12% -8%, rgba(200,164,91,.11), transparent 55%),
    radial-gradient(ellipse 65% 50% at 105% 108%, rgba(200,164,91,.08), transparent 55%)}
#dk-app,#dk-app *,#dk-app *::before,#dk-app *::after{
  box-sizing:border-box !important;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif !important;
  letter-spacing:normal !important;
  line-height:1.45 !important;
  color:#f5f1e8 !important;
  -webkit-font-smoothing:antialiased;
}
#dk-app{min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom))}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;
  background:rgba(255,255,255,.03)}
.lang button{border:0;background:transparent;color:#f5f1e8 !important;font-size:13px;font-weight:600;padding:9px 15px;cursor:pointer;
  transition:all .18s var(--ease)}
.lang button.active{background:var(--grad-gold);color:#241a0c !important}

/* Zoekbalk */
.search-row{display:flex;gap:10px;align-items:center;margin:0;flex:0 0 auto}
.search{flex:1;min-width:0;min-height:50px;border:1px solid var(--line);border-radius:999px;padding:0 22px;font-size:16px;outline:none;
  background:rgba(0,0,0,.35);color:#f5f1e8;transition:all .2s var(--ease)}
.search::placeholder{color:#f5f1e8 !important;opacity:.45}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,164,91,.16),0 0 24px -8px rgba(200,164,91,.45)}

/* Categorietabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0;flex:0 0 auto}
.tab{min-height:40px;padding:0 17px;border:1px solid var(--line);border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0));color:#f5f1e8 !important;
  font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:all .2s var(--ease)}
.tab .count{font-size:12px;opacity:.6;font-weight:500}
.tab:hover{border-color:var(--line-strong);background:rgba(200,164,91,.12);transform:translateY(-1px)}
.tab:active{transform:scale(.97)}
.tab.active{background:var(--grad-gold);color:#241a0c !important;border-color:transparent;
  box-shadow:0 6px 20px -6px rgba(200,164,91,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.tab.active *{color:#241a0c !important}

/* Tegels — grid met vaste minimumbreedte; structuur is Safari-kritisch */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (max-width:640px){ .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px} }
/* Block layout (NOT flex): Safari renders flex/grid on <button> incorrectly,
   which collapsed the image and hid the titles. Normal block flow stacks the
   image and the text body reliably in every browser. */
.tile{border:1px solid rgba(200,164,91,.22);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;
  display:block;padding:0;margin:0;-webkit-appearance:none;appearance:none;font:inherit;color:inherit;
  background:linear-gradient(180deg,#17120b,#100c07);
  box-shadow:0 4px 16px -6px rgba(0,0,0,.6);
  transition:transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease)}
.tile:hover{transform:translateY(-4px);border-color:var(--line-strong);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7),0 8px 28px -8px rgba(200,164,91,.35)}
.tile:active{transform:translateY(-1px) scale(.99)}
/* Vierkante fotowrapper. aspect-ratio op een DIV (niet op de <img>) is
   betrouwbaar op Safari én telt correct mee bij de grid-rijhoogte. */
.tile-imgwrap{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;background:#0d0a07}
.tile-img{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .35s var(--ease)}
.tile:hover .tile-img{transform:scale(1.045)}
.tile-imgwrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
  background:linear-gradient(to top,rgba(13,10,7,.55),transparent);pointer-events:none}
.tile-body{padding:9px 12px 11px;display:block}
.tile-cat{margin:0 0 2px;font-size:9.5px;color:var(--gold-bright) !important;text-transform:uppercase;letter-spacing:.6px !important;font-weight:700}
/* Plain block, geen -webkit-line-clamp (Safari-bug) */
.tile-name{margin:0;font-size:13.5px;font-weight:600;line-height:1.3 !important;color:#f5f1e8 !important;overflow-wrap:anywhere}
.tile-meta{margin:2px 0 0;font-size:11px;color:#f5f1e8 !important;opacity:.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-meta.wine{color:var(--gold-bright) !important;opacity:.9;font-weight:600}

.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:18px;padding:36px 16px;text-align:center;color:#f5f1e8 !important;opacity:.7}

/* Popup */
.overlay{position:fixed;inset:0;background:rgba(5,4,2,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;opacity:0;pointer-events:none;
  transition:opacity .22s var(--ease)}
.overlay.open{opacity:1;pointer-events:auto}
.modal{position:relative;width:100%;max-width:960px;max-height:92dvh;overflow-y:auto;
  background:linear-gradient(180deg,#17120b,#0e0a06);border:1px solid var(--line);border-radius:26px;
  box-shadow:0 40px 100px -20px rgba(0,0,0,.85),0 0 60px -20px rgba(200,164,91,.3),inset 0 1px 0 rgba(240,210,138,.1);
  transform:translateY(16px) scale(.97);transition:transform .28s var(--ease)}
.overlay.open .modal{transform:translateY(0) scale(1)}
.modal-hero{position:relative}
.modal-hero img{width:100%;height:clamp(190px,32vh,300px);object-fit:cover;display:block;background:#0d0a07}
.modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(15,11,7,1) 2%, rgba(15,11,7,0) 45%);pointer-events:none}
.close{position:absolute;top:14px;right:14px;width:38px;height:38px;border:1px solid var(--line);
  background:rgba(8,6,4,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:999px;color:var(--gold-bright) !important;font-size:22px;line-height:1 !important;cursor:pointer;
  display:grid;place-items:center;z-index:3;transition:all .18s var(--ease)}
.close:hover{background:rgba(200,164,91,.2);transform:rotate(90deg)}

/* Breed scherm: foto links, stappen rechts */
@media (min-width:760px){
  .modal{max-width:960px;max-height:86dvh;overflow:hidden;display:grid;grid-template-columns:minmax(300px,38%) 1fr;grid-template-rows:auto 1fr}
  .modal-hero{grid-column:1;grid-row:1 / span 2;height:100%;overflow:hidden}
  .modal-hero img{height:100%;min-height:100%}
  .modal-hero::after{display:none}
  .modal-head{grid-column:2;grid-row:1;margin-top:0 !important;padding:26px 30px 10px !important}
  .modal-body{grid-column:2;grid-row:2;min-height:0;overflow-y:auto;padding:6px 30px 28px !important}
}
.modal-head{padding:4px 22px 12px;margin-top:-6px;position:relative;z-index:1}
.modal-cat{margin:0 0 5px;font-size:11px;color:var(--gold-bright) !important;text-transform:uppercase;letter-spacing:.7px !important;font-weight:700}
.modal-title{margin:0;font-size:23px;font-weight:650;line-height:1.22 !important}
/* Glas/fles-schakelaar */
.vtoggle{display:none;margin:16px 0 2px;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:fit-content;
  background:rgba(0,0,0,.3)}
.vtoggle.show{display:inline-flex}
.vtoggle button{border:0;background:transparent;color:#f5f1e8 !important;font-size:13px;font-weight:600;padding:9px 22px;cursor:pointer;
  transition:all .18s var(--ease)}
.vtoggle button.active{background:var(--grad-gold);color:#241a0c !important}
.modal-body{padding:8px 22px 26px}
.prep-label{margin:0 0 14px;font-size:11.5px;color:#f5f1e8 !important;opacity:.5;text-transform:uppercase;letter-spacing:.7px !important;font-weight:700}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:step}
.steps li{position:relative;padding:12px 14px 12px 52px;font-size:15px;min-height:30px;display:flex;align-items:center;
  background:rgba(255,255,255,.025);border:1px solid rgba(200,164,91,.14);border-radius:14px}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:999px;background:var(--grad-gold);color:#241a0c !important;
  font-weight:700;font-size:14px;display:grid;place-items:center;
  box-shadow:0 3px 10px -3px rgba(200,164,91,.6)}

.hidden{display:none !important}

@media (max-width:640px){
  .wrap{padding:12px 12px calc(10px + env(safe-area-inset-bottom))}
  .grid{gap:9px}
  .tile-body{padding:7px 9px 9px}
  .tile-name{font-size:12.5px}
  .tab{min-height:36px;padding:0 13px;font-size:12.5px}
  .modal-head{padding:4px 18px 10px}
  .modal-body{padding:8px 18px 22px}
  .modal-title{font-size:20px}
}
</style>
</head>

<body>
<div id="protectedApp">
<div id="dk-app">
  <div class="wrap">
    <div class="search-row">
      <input id="q" class="search" type="text" aria-label="Zoek een drankje">
      <div class="lang" role="group" aria-label="Taal / Language">
        <button id="langNL" type="button" data-lang="nl">NL</button>
        <button id="langEN" type="button" data-lang="en">EN</button>
        <button id="langDE" type="button" data-lang="de">DE</button>
      </div>
    </div>

    <nav id="tabs" class="tabs" aria-label="Categorieën"></nav>

    <div id="grid" class="grid"></div>
  </div>
</div>
</div>

<!-- Modal -->
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <button id="modalClose" class="close" type="button" aria-label="Sluiten">×</button>
    <div class="modal-hero">
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-head">
      <p id="modalCat" class="modal-cat"></p>
      <h2 id="modalTitle" class="modal-title"></h2>
      <div id="variantToggle" class="vtoggle" role="group" aria-label="Glas of fles">
        <button type="button" data-v="glas"></button>
        <button type="button" data-v="fles"></button>
      </div>
    </div>
    <div class="modal-body">
      <p id="prepLabel" class="prep-label"></p>
      <ol id="modalSteps" class="steps"></ol>
    </div>
  </div>
</div>

<script>
const CAT_ORDER = ["Fris","Cocktails","Bier","Wijn","Sterke drank","Koffie en thee"];
const CAT_EN = {
  "Fris":"Soft drinks","Cocktails":"Cocktails","Bier":"Beer",
  "Wijn":"Wine","Sterke drank":"Spirits","Koffie en thee":"Coffee & tea"
};
const CAT_DE = {
  "Fris":"Softdrinks","Cocktails":"Cocktails","Bier":"Bier",
  "Wijn":"Wein","Sterke drank":"Spirituosen","Koffie en thee":"Kaffee & Tee"
};
const T = {
  nl:{ placeholder:"Zoek een drankje…",
       prep:"Bereidingswijze", step:"stap", steps:"stappen", glas:"Glas", fles:"Fles",
       empty:"Geen drankjes gevonden", emptyFor:"Geen drankjes gevonden voor" },
  en:{ placeholder:"Search a drink…",
       prep:"Preparation", step:"step", steps:"steps", glas:"Glass", fles:"Bottle",
       empty:"No drinks found", emptyFor:"No drinks found for" },
  de:{ placeholder:"Getränk suchen…",
       prep:"Zubereitung", step:"Schritt", steps:"Schritte", glas:"Glas", fles:"Flasche",
       empty:"Keine Getränke gefunden", emptyFor:"Keine Getränke gefunden für" }
};

let DATA = [];
let DISPLAY = [];
let activeCat = CAT_ORDER[0];
let query = "";
let lang = localStorage.getItem("zusje_dranken_lang") || "nl";
let currentItem = null;      // display item shown in modal
let currentVariant = null;   // 'glas' | 'fles' | 'single'

fetch("data.json")
  .then(r => r.json())
  .then(d => { DATA = d; buildDisplay(); applyLang(); buildTabs(); render(); })
  .catch(e => { console.error("Kon data.json niet laden:", e); });

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalize(str){
  return (str||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
}
function normKey(str){
  return normalize(str).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function catLabel(cat){ return lang==="en" ? CAT_EN[cat] : lang==="de" ? CAT_DE[cat] : cat; }

// Build display items: wines grouped into one item with glas/fles variants; everything else single.
function buildDisplay(){
  DISPLAY = [];
  const wineGroups = new Map();
  for (const d of DATA){
    if (d.category === "Wijn"){
      let vtype = "fles", base = d.name, base_en = d.name_en, base_de = d.name_de;
      if (d.name.startsWith("Glas ")){ vtype="glas"; base=d.name.slice(5); }
      else if (d.name.startsWith("Fles ")){ vtype="fles"; base=d.name.slice(5); }
      if (d.name_en.startsWith("Glass of ")) base_en=d.name_en.slice(9);
      else if (d.name_en.startsWith("Bottle of ")) base_en=d.name_en.slice(10);
      if (d.name_de.startsWith("Glas ")) base_de=d.name_de.slice(5);
      else if (d.name_de.startsWith("Flasche ")) base_de=d.name_de.slice(8);
      const key = normKey(base);
      let item = wineGroups.get(key);
      if (!item){
        item = { category:"Wijn", isWine:true, name:base, name_en:base_en, name_de:base_de, variants:{} };
        wineGroups.set(key, item);
        DISPLAY.push(item);
      }
      item.variants[vtype] = d;
    } else {
      DISPLAY.push({ category:d.category, isWine:false, name:d.name, name_en:d.name_en, name_de:d.name_de, variants:{ single:d } });
    }
  }
}

function itemName(item){ return lang==="en" ? item.name_en : lang==="de" ? item.name_de : item.name; }
function defaultVariant(item){
  return item.variants.glas ? "glas" : (item.variants.fles ? "fles" : "single");
}
function variantDrink(item, v){ return item.variants[v]; }
function drinkSteps(d){ return lang==="en" ? d.steps_en : lang==="de" ? d.steps_de : d.steps; }

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("langNL").classList.toggle("active", lang==="nl");
  document.getElementById("langEN").classList.toggle("active", lang==="en");
  document.getElementById("langDE").classList.toggle("active", lang==="de");
  document.getElementById("q").placeholder = T[lang].placeholder;
  document.getElementById("prepLabel").textContent = T[lang].prep;
  const vt = document.getElementById("variantToggle");
  vt.querySelector('[data-v="glas"]').textContent = T[lang].glas;
  vt.querySelector('[data-v="fles"]').textContent = T[lang].fles;
}

function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = CAT_ORDER.map(cat => {
    const n = DISPLAY.filter(it => it.category === cat).length;
    return `<button class="tab${cat===activeCat?' active':''}" type="button" data-cat="${escapeHtml(cat)}">
      <span class="lbl">${escapeHtml(catLabel(cat))}</span> <span class="count">${n}</span>
    </button>`;
  }).join("");
  tabsEl.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("click", () => {
      activeCat = b.dataset.cat;
      tabsEl.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.cat===activeCat));
      render();
    });
  });
}

function itemMatches(item, q){
  if (normalize(item.name).includes(q) || normalize(item.name_en).includes(q) || normalize(item.name_de).includes(q)) return true;
  return Object.values(item.variants).some(d =>
    normalize(d.name).includes(q) || normalize(d.name_en).includes(q) || normalize(d.name_de).includes(q));
}

function render(){
  const gridEl = document.getElementById("grid");
  const q = normalize(query);
  let list = q ? DISPLAY.filter(it => itemMatches(it, q))
               : DISPLAY.filter(it => it.category === activeCat);

  if (!list.length){
    const msg = q ? `${T[lang].emptyFor} “${escapeHtml(query)}”.` : `${T[lang].empty}.`;
    gridEl.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  gridEl.innerHTML = list.map(item => {
    const idx = DISPLAY.indexOf(item);
    const v0 = defaultVariant(item);
    const d0 = variantDrink(item, v0);
    const showCat = q ? `<p class="tile-cat">${escapeHtml(catLabel(item.category))}</p>` : '';
    return `<div class="tile" role="button" tabindex="0" onclick="openModal(${idx})">
      <div class="tile-imgwrap"><img class="tile-img" src="${escapeHtml(d0.img)}" alt="${escapeHtml(itemName(item))}" loading="lazy"></div>
      <div class="tile-body">
        ${showCat}
        <p class="tile-name">${escapeHtml(itemName(item))}</p>
      </div>
    </div>`;
  }).join("");
}
// Geen JS-fit meer: de grid is nu een gewone responsive auto-fill grid die
// naar de inhoud schaalt en de pagina laat scrollen. De vroegere fit-berekening
// gaf de grid een vaste hoogte, waardoor de rijen inklapten en tegels afkapten.

function renderVariant(){
  const item = currentItem;
  const d = variantDrink(item, currentVariant);
  document.getElementById("modalImg").src = d.img;
  document.getElementById("modalImg").alt = itemName(item);
  document.getElementById("modalSteps").innerHTML = drinkSteps(d).map(s => `<li>${escapeHtml(s)}</li>`).join("");
  const vt = document.getElementById("variantToggle");
  vt.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.v===currentVariant));
}

function openModal(idx){
  const item = DISPLAY[idx];
  if (!item) return;
  currentItem = item;
  document.getElementById("modalCat").textContent = catLabel(item.category);
  document.getElementById("modalTitle").textContent = itemName(item);
  document.getElementById("prepLabel").textContent = T[lang].prep;

  const vt = document.getElementById("variantToggle");
  const hasBoth = item.isWine && item.variants.glas && item.variants.fles;
  vt.classList.toggle("show", !!hasBoth);
  currentVariant = defaultVariant(item);   // glass by default
  renderVariant();

  const ov = document.getElementById("overlay");
  ov.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
  currentItem = null; currentVariant = null;
}

function setLang(l){
  lang = l;
  localStorage.setItem("zusje_dranken_lang", l);
  applyLang();
  buildTabs();
  render();
  if (currentItem){
    document.getElementById("modalCat").textContent = catLabel(currentItem.category);
    document.getElementById("modalTitle").textContent = itemName(currentItem);
    renderVariant();
  }
}

document.getElementById("langNL").addEventListener("click", () => setLang("nl"));
document.getElementById("langEN").addEventListener("click", () => setLang("en"));
document.getElementById("langDE").addEventListener("click", () => setLang("de"));
document.getElementById("variantToggle").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !currentItem) return;
  currentVariant = b.dataset.v; renderVariant();
});
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
</script>

</body>
</html>
