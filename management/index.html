<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Management</title>
<style>
:root{--gold:#c8a45b;--gold-bright:#f0d28a;--bg:#0b0906;--bg2:#120d08;--line:rgba(200,164,91,.3);--muted:rgba(245,241,232,.55);--grad-gold:linear-gradient(180deg,#f4dc9c 0%,#d9b26a 55%,#c8a45b 100%);--ease:cubic-bezier(.4,0,.2,1)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse 90% 45% at 50% -8%, rgba(200,164,91,.10), transparent 60%),linear-gradient(180deg,#0d0a07,#0b0906);color:#f5f1e8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:26px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 26px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;
  min-height:104px;border:1px solid rgba(200,164,91,.28);border-radius:20px;
  background:linear-gradient(180deg,#191309,#110d07);
  padding:18px;cursor:pointer;transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease);
  font-family:inherit;color:#fff;box-shadow:0 10px 26px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.03)}
.card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 18px 40px -12px rgba(0,0,0,.6),0 8px 30px -8px rgba(200,164,91,.35)}
.card:active{transform:translateY(-1px) scale(.985)}
.card .title{font-size:17px;font-weight:750;line-height:1.3;background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* Wachtwoordslot */
#lockScreen{position:fixed;inset:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.lock-card{width:100%;max-width:400px;border:1px solid var(--line);border-radius:26px;padding:34px 28px;text-align:center;
  background:linear-gradient(180deg,rgba(28,22,14,.9),rgba(16,12,8,.95));
  box-shadow:0 30px 70px -20px rgba(0,0,0,.8),0 0 50px -18px rgba(200,164,91,.25),inset 0 1px 0 rgba(240,210,138,.1)}
.lock-icon{font-size:32px;margin-bottom:10px}
.lock-card h2{margin:0 0 6px;font-size:20px;font-weight:600}
.lock-card p{margin:0 0 18px;font-size:13px;color:var(--muted)}
.lock-card input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:#fff;
  font-size:16px;padding:0 16px;outline:none;text-align:center;margin-bottom:12px}
.lock-card input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,91,.16)}
.lock-card button{width:100%;min-height:48px;border:none;background:var(--grad-gold);color:#241a0c;
  border-radius:999px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px -6px rgba(200,164,91,.5),inset 0 1px 0 rgba(255,255,255,.5);transition:all .18s var(--ease)}
.lock-card button:hover{filter:brightness(1.06)}
.lock-err{color:#ff9b9b;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="lockScreen">
  <div class="lock-card">
    <h2>Management</h2>
    <p>Voer het wachtwoord in om verder te gaan.</p>
    <input id="lockInput" type="password" placeholder="Wachtwoord" aria-label="Wachtwoord" autocomplete="off">
    <button id="lockBtn" type="button">Ontgrendelen</button>
    <p class="lock-err" id="lockErr"></p>
  </div>
</div>

<div class="wrap">
  <h1>Management</h1>

  <div class="grid">
    <a class="card" href="kassa-afsluiting.html">
      <span class="title">Kassa afsluiting</span>
    </a>

    <button class="card" type="button" data-go="taken">
      <span class="title">Taken &amp; agenda</span>
    </button>

    <a class="card" href="nieuwe-medewerker.html">
      <span class="title">Nieuwe medewerker</span>
    </a>

    <button class="card" type="button" data-go="checklists">
      <span class="title">Checklists bewerken</span>
    </button>

    <a class="card" href="https://sjorsgofers.github.io/monitor-dashboard/" target="_blank" rel="noopener">
      <span class="title">Dashboard</span>
    </a>

    <a class="card" href="https://zusje.reserveersysteem.eu/contao?do=restaurant_dashboard&restaurant=1009" target="_blank" rel="noopener">
      <span class="title">Reserveringen</span>
    </a>

    <a class="card" href="https://app.shiftbase.com/" target="_blank" rel="noopener">
      <span class="title">Shiftbase</span>
    </a>
  </div>
</div>

<script>
(function(){
  const PASSWORD = "kikker";
  // Restanten van de eerdere "onthouden"-versie opruimen
  try{ ["zusje_mgmt_unlocked","zusje_taken_unlocked","zusje_cl_unlocked"].forEach(k=>{
    localStorage.removeItem(k); sessionStorage.removeItem(k);
  }); }catch(e){}

  function markUnlocked(key){
    try{ localStorage.setItem(key, String(Date.now())); }catch(e){}
  }

  const $ = id => document.getElementById(id);
  const gate = $("lockScreen"), input = $("lockInput"), err = $("lockErr");

  function unlock(){
    gate.style.display = "none";
  }
  function tryUnlock(){
    if((input.value||"").trim().toLowerCase() === PASSWORD){ err.textContent=""; unlock(); }
    else { err.textContent = "Onjuist wachtwoord."; input.value=""; input.focus(); }
  }
  $("lockBtn").addEventListener("click", tryUnlock);
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") tryUnlock(); });
  setTimeout(()=>input.focus(), 100);

  // Altijd opnieuw vragen: de shell stuurt "vergrendel" zodra je dit tabblad verlaat
  // of opnieuw opent. Zo blijft een openstaande pc niet toegankelijk.
  function lock(){
    gate.style.display = "";
    input.value = "";
    err.textContent = "";
  }
  window.addEventListener("message", e=>{
    if(e.data && e.data.type === "zusjeLock") lock();
  });

  // Interne knoppen: laat de app-shell naar het juiste tabblad springen.
  document.querySelectorAll("[data-go]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const target = btn.dataset.go;
      try{ window.parent.postMessage({ type:"zusjeGoTab", tab:target }, "*"); }catch(e){}
    });
  });
})();
</script>
</body>
</html>
