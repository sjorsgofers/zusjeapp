<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Zusje App</title>

<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zusje">
<meta name="application-name" content="Zusje">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="manifest" href="manifest.json">

<style>
:root{ --gold:#c8a45b; --bg:#111111; --bg2:#0b0b0b; --bar:64px; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:#fff;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;overflow:hidden}

/* Shell */
#shell{display:none;flex-direction:column;height:100dvh;width:100%}
#shell.show{display:flex}
.tabbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px max(12px,env(safe-area-inset-left)) 8px max(12px,env(safe-area-inset-right));
  padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bg2);border-bottom:1px solid rgba(200,164,91,.35);position:relative;z-index:2}
.tabbar .logo{height:34px;width:auto;display:block;flex:0 0 auto;margin-right:2px;cursor:pointer}
.tabbar .logo:hover{opacity:.85}
.logobtn{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;margin-right:2px;padding:3px 9px 3px 3px;
  background:transparent;border:1px solid rgba(200,164,91,.45);border-radius:999px;cursor:pointer;
  transition:background .15s ease,border-color .15s ease}
.logobtn:hover{background:#1a1a1a;border-color:var(--gold)}
.minibtn{flex:0 0 auto;border:1px solid rgba(200,164,91,.45);background:transparent;color:var(--gold);
  font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s ease,border-color .15s ease}
.minibtn:hover{background:#1a1a1a;border-color:var(--gold)}
.minibtn-ico{display:inline-flex;align-items:center;justify-content:center;padding:0;width:40px;height:40px;border-radius:999px}
.minibtn-ico svg{display:block}
.minibtn.active{background:var(--gold);color:#0b0b0b;border-color:var(--gold)}
.logobtn-txt{font-size:13.5px;font-weight:600;color:var(--gold);line-height:1;white-space:nowrap;padding-right:2px}
@media (max-width:560px){ .logobtn{padding:2px 8px 2px 2px;gap:5px} .logobtn-txt{font-size:12px} .minibtn{font-size:11.5px;padding:6px 10px} }
.tabs{display:flex;gap:8px;flex:1;justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;flex:0 0 auto;border:1px solid var(--gold);background:transparent;color:#fff;
  font-size:15px;font-weight:600;padding:10px 20px;border-radius:999px;cursor:pointer;
  transition:background .15s ease;white-space:nowrap}
.tab:hover{background:#1a1a1a}
.tab.active{background:var(--gold);color:#0b0b0b}
.tablink{width:40px;height:40px;flex:0 0 auto;border:1px solid var(--gold);border-radius:999px;
  background:transparent;color:var(--gold);display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:17px}
.tablink:hover{background:#1a1a1a}

/* Kiosk-knop met Shiftbase-logo */
.tab-kiosk{display:inline-flex;align-items:center;gap:8px;padding-left:12px}
.tab-logo{width:20px;height:20px;object-fit:contain;display:block;flex:0 0 auto}

/* Subtabs: tweede rij onder de hoofdcategorie */
.subtabs{flex:0 0 auto;background:#0e0e0e;border-bottom:1px solid rgba(200,164,91,.22);
  padding:7px max(12px,env(safe-area-inset-left));position:relative;z-index:2}
.subtabs.hidden{display:none}
.subrow{display:flex;gap:7px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.subrow::-webkit-scrollbar{display:none}
.subrow.hidden{display:none}
.subtab{appearance:none;flex:0 0 auto;border:1px solid rgba(200,164,91,.45);background:transparent;color:rgba(255,255,255,.85);
  font-size:13.5px;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .15s ease,color .15s ease}
.subtab:hover{background:#1a1a1a;color:#fff}
.subtab.active{background:var(--gold);color:#0b0b0b;border-color:var(--gold)}
@media (max-width:560px){
  .subrow{justify-content:flex-start}
  .subtab{font-size:12.5px;padding:7px 13px}
  .tab-logo{width:18px;height:18px}
}

.stage{flex:1 1 auto;position:relative;background:var(--bg)}
.kioskhint{position:absolute;top:0;left:0;right:0;z-index:3;display:none;align-items:center;justify-content:center;gap:8px;
  background:rgba(11,11,11,.94);border-bottom:1px solid var(--gold);color:#fff;font-size:13px;line-height:1.35;
  padding:9px 46px 9px 16px;text-align:center}
.kioskhint.show{display:flex}
.kioskhint b{color:var(--gold)}
.kioskhint .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:1px solid var(--gold);
  background:transparent;color:var(--gold);border-radius:999px;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
.kioskhint .x:hover{background:#1a1a1a}
@media (max-width:560px){ .kioskhint{font-size:12px;padding:8px 42px 8px 12px} }
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.frame.active{display:block}

/* Screensaver — dashboard shown after 1 min idle; any input dismisses it */
#screensaver{position:fixed;inset:0;z-index:100;background:#000;display:none}
#screensaver.show{display:block}
#screensaver iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.frameholder{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;opacity:.6;font-size:14px;text-align:center;padding:24px}
.frameholder.active{display:flex}

@media (max-width:560px){
  .tab{font-size:13.5px;padding:9px 13px}
  .tabbar .logo{height:28px}
  .tablink{width:38px;height:38px}
  /* Op mobiel swipet de héle balk mee: Dashboard, categorieën, Kiosk én
     Management staan in één horizontale rij i.p.v. vastgezet aan de randen. */
  .tabbar{gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap}
  .tabbar::-webkit-scrollbar{display:none}
  .tabs{flex:0 0 auto;justify-content:flex-start;overflow:visible;padding:0}
  .logobtn,.minibtn,.tablink{flex:0 0 auto}
}

/* Login gate */
#loginGate{position:fixed;inset:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
#loginGate.hidden{display:none}
.login-shell{width:100%;max-width:520px}
.login-card{border:1px solid var(--gold);background:var(--bg2);border-radius:24px;padding:28px 24px;box-shadow:0 14px 42px rgba(200,164,91,.12);text-align:center}
.login-logo{width:150px;max-width:44vw;display:block;margin:0 auto 20px}
.login-title{margin:0 0 18px;font-size:28px;font-weight:600}
.login-row{display:flex;gap:10px;align-items:center}
.login-input{flex:1;min-height:56px;border:1px solid var(--gold);border-radius:28px;padding:0 20px;font-size:16px;outline:none;background:var(--bg);color:#fff;box-shadow:0 8px 24px rgba(200,164,91,.12)}
.login-input::placeholder{color:#fff;opacity:.7}
.login-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,91,.18), 0 8px 24px rgba(200,164,91,.18)}
.login-btn{min-height:56px;padding:0 20px;border:1px solid var(--gold);border-radius:28px;background:var(--bg2);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.login-error{margin:12px 0 0;font-size:13px}
.hidden{display:none !important}
@media (max-width:560px){
  .login-card{padding:22px 18px;border-radius:20px}
  .login-title{font-size:24px}
  .login-row{flex-direction:column}
  .login-input,.login-btn{width:100%}
}
</style>
</head>
<body>

<!-- Login -->
<div id="loginGate">
  <div class="login-shell">
    <div class="login-card">
      <img class="login-logo" src="logo.png" alt="Zusje logo">
      <h1 class="login-title">Inloggen</h1>
      <div class="login-row">
        <input id="passwordInput" class="login-input" type="password" placeholder="Wachtwoord" aria-label="Wachtwoord">
        <button id="loginBtn" class="login-btn" type="button">Open</button>
      </div>
      <p id="loginError" class="login-error hidden">Onjuist wachtwoord</p>
    </div>
  </div>
</div>

<!-- App shell -->
<div id="shell">
  <header class="tabbar">
    <button id="ssTrigger" class="logobtn" type="button" title="Dashboard tonen" aria-label="Dashboard tonen">
      <img class="logo" src="logo.png" alt="Zusje">
      <span class="logobtn-txt">Dashboard</span>
    </button>
    <nav class="tabs" role="tablist" aria-label="Onderdelen">
      <button class="tab active" type="button" data-group="bediening">Bediening</button>
      <button class="tab" type="button" data-group="keuken">Keuken</button>
      <button class="tab tab-kiosk" type="button" role="tab" data-tab="kiosk" title="Kiosk">
        <img src="shiftbase-logo.webp" alt="" class="tab-logo"><span>Kiosk</span>
      </button>
    </nav>
    <button id="mgmtBtn" class="minibtn minibtn-ico" type="button" data-tab="management" title="Management" aria-label="Management"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></button>
    <a id="kioskOpen" class="tablink hidden" href="https://kiosk.shiftbase.com/" target="_blank" rel="noopener" title="Kiosk in nieuw tabblad openen" aria-label="Kiosk in nieuw tabblad openen">↗</a>
  </header>

  <nav class="subtabs" id="subtabs" aria-label="Onderdelen binnen categorie">
    <div class="subrow" data-subrow="bediening">
      <button class="subtab active" type="button" data-tab="table">Tafeloverzicht</button>
      <button class="subtab" type="button" data-tab="checklists">Checklists</button>
      <button class="subtab" type="button" data-tab="dranken">Dranken</button>
      <button class="subtab" type="button" data-tab="reserveringen">Reserveringen ↗</button>
    </div>
    <div class="subrow hidden" data-subrow="keuken">
      <button class="subtab" type="button" data-tab="allergenen">Allergenen</button>
      <button class="subtab" type="button" data-tab="keukenchecklists">Checklists</button>
      <button class="subtab" type="button" data-tab="labels">Labels</button>
    </div>
  </nav>

  <main class="stage">
    <div id="kioskHint" class="kioskhint">
      <span>Eenmalig inloggen op dit apparaat — <b>Account&nbsp;ID</b>&nbsp;105540&nbsp;&nbsp;·&nbsp;&nbsp;<b>Kiosk&nbsp;code</b>&nbsp;gr3gh. Daarna blijft de kiosk ingelogd.</span>
      <button id="kioskHintClose" class="x" type="button" aria-label="Sluiten">×</button>
    </div>
    <iframe id="f-dranken"    class="frame active" title="Dranken"    data-src="dranken/index.html"></iframe>
    <iframe id="f-allergenen" class="frame"        title="Allergenen" data-src="allergenen/index.html"></iframe>
    <iframe id="f-checklists" class="frame"        title="Checklists" data-src="checklists/index.html"></iframe>
    <iframe id="f-keukenchecklists" class="frame" title="Keukenchecklists" data-src="keukenchecklists/index.html"></iframe>
    <iframe id="f-taken"      class="frame"        title="Taken & agenda" data-src="taken/index.html"></iframe>
    <iframe id="f-table"      class="frame"        title="Table"      data-src="table/index.html"></iframe>
    <iframe id="f-labels"     class="frame"        title="Labels"     data-src="https://desktop-o25ac4v.tail7db321.ts.net/" referrerpolicy="no-referrer"></iframe>
    <iframe id="f-management" class="frame"        title="Management" data-src="management/index.html"></iframe>
    <iframe id="f-kiosk"      class="frame"        title="Kiosk"      data-src="https://kiosk.shiftbase.com/"
            allow="camera; microphone; fullscreen; geolocation; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </main>
</div>

<!-- Screensaver overlay (dashboard) -->
<div id="screensaver" aria-hidden="true">
  <iframe id="f-screensaver" title="Dashboard" data-src="https://sjorsgofers.github.io/monitor-dashboard/"
          allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
(function(){
  const TABS = ["dranken","allergenen","checklists","keukenchecklists","taken","table","labels","management","kiosk"];
  // Welke pagina's onder welke hoofdcategorie vallen (eerste = standaard)
  const GROUPS = { bediening:["table","checklists","dranken","reserveringen"], keuken:["allergenen","keukenchecklists","labels"] };
  function groupOf(tab){
    for (const g in GROUPS) if (GROUPS[g].includes(tab)) return g;
    return null;
  }
  const RESERVERINGEN_URL = "https://zusje.reserveersysteem.eu/contao?do=restaurant_dashboard&restaurant=1009";
  let currentTab = "table";
  const shell = document.getElementById("shell");

  function frame(name){ return document.getElementById("f-"+name); }
  function ensureLoaded(name){
    const f = frame(name);
    if (f && f.dataset.src && !f.src){
      f.addEventListener("load", () => attachFrameActivity(f), { once:true });
      f.src = f.dataset.src;
    }
  }

  // Beveiligde pagina's altijd opnieuw op slot bij een tabwissel, zodat een
  // openstaande pc niet toegankelijk blijft.
  const LOCKED_TABS = ["management","taken"];
  function lockSecureTabs(){
    LOCKED_TABS.forEach(t => {
      const f = frame(t);
      if (f && f.src && f.contentWindow){
        try { f.contentWindow.postMessage({ type:"zusjeLock" }, "*"); } catch(e){}
      }
    });
  }

  function activate(name){
    if (!TABS.includes(name)) name = "table";
    lockSecureTabs();
    currentTab = name;
    ensureLoaded(name);
    TABS.forEach(t => {
      const f = frame(t);
      if (f) f.classList.toggle("active", t===name);
      const tb = document.querySelector('.tab[data-tab="'+t+'"]');
      if (tb) tb.classList.toggle("active", t===name);
      const mb = document.querySelector('.minibtn[data-tab="'+t+'"]');
      if (mb) mb.classList.toggle("active", t===name);
    });
    // Hoofdcategorie + subtabs bijwerken
    const g = groupOf(name);
    document.querySelectorAll('.tab[data-group]').forEach(b => b.classList.toggle("active", b.dataset.group===g));
    document.querySelectorAll('.subrow').forEach(r => r.classList.toggle("hidden", r.dataset.subrow!==g));
    document.getElementById("subtabs").classList.toggle("hidden", !g);
    document.querySelectorAll('.subtab').forEach(b => b.classList.toggle("active", b.dataset.tab===name));
    document.getElementById("kioskOpen").classList.toggle("hidden", name!=="kiosk");
    updateKioskHint(name);
    try { localStorage.setItem("zusje_hub_tab", name); } catch(e){}
  }

  // Kleine knop naast het logo (Taken & agenda)
  document.querySelectorAll(".minibtn").forEach(b => {
    b.addEventListener("click", () => openTab(b.dataset.tab));
  });

  // Subtabs binnen een categorie
  document.querySelectorAll(".subtab").forEach(b => {
    b.addEventListener("click", () => openTab(b.dataset.tab));
  });

  // Management-pagina kan de shell vragen naar een ander tabblad te springen
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (d && d.type === "zusjeGoTab" && typeof d.tab === "string") openTab(d.tab);
  });

  function hintDismissed(){
    try { return localStorage.getItem("zusje_kiosk_hint_dismissed") === "1"; } catch(e){ return false; }
  }
  function updateKioskHint(name){
    const hint = document.getElementById("kioskHint");
    hint.classList.toggle("show", name==="kiosk" && !hintDismissed());
  }
  document.getElementById("kioskHintClose").addEventListener("click", () => {
    try { localStorage.setItem("zusje_kiosk_hint_dismissed","1"); } catch(e){}
    document.getElementById("kioskHint").classList.remove("show");
  });

  function openTab(tab){
    if (tab === "reserveringen"){ window.open(RESERVERINGEN_URL, "_blank", "noopener"); return; }
    activate(tab);
  }
  // Hoofdknoppen: categorie opent zijn eerste pagina, losse knoppen openen zichzelf
  document.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.group){
        const list = GROUPS[b.dataset.group] || [];
        const active = list.find(t => t === currentTab);
        openTab(active || list[0]);
        return;
      }
      openTab(b.dataset.tab);
    });
  });

  /* ---------- Screensaver / idle ---------- */
  const IDLE_MS = 60000;                 // 1 minuut
  const ACT_EVENTS = ["mousemove","mousedown","keydown","touchstart","wheel","scroll"];
  const screensaver = document.getElementById("screensaver");
  let idleTimer = null;
  let saverOn = false;
  let idleReady = false;

  function showSaver(){
    const f = document.getElementById("f-screensaver");
    if (f && f.dataset.src && !f.src) f.src = f.dataset.src;
    screensaver.classList.add("show");
    screensaver.setAttribute("aria-hidden","false");
    saverOn = true;
  }
  function hideSaver(){
    screensaver.classList.remove("show");
    screensaver.setAttribute("aria-hidden","true");
    saverOn = false;
  }
  // Automatisch tonen — nooit op het Table-tabblad.
  function autoShow(){
    if (currentTab === "table") return;
    showSaver();
  }
  function onActivity(){
    if (!idleReady) return;
    if (saverOn) hideSaver();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(autoShow, IDLE_MS);
  }
  function bindActivity(target){
    if (!target) return;
    ACT_EVENTS.forEach(ev => {
      try { target.addEventListener(ev, onActivity, { passive:true }); } catch(e){}
    });
  }
  // Interaction inside a same-origin sub-app iframe also counts as activity.
  function attachFrameActivity(f){
    try { bindActivity(f.contentDocument); } catch(e){ /* cross-origin (kiosk): ignore */ }
  }
  function initIdle(){
    if (idleReady) return;
    idleReady = true;
    bindActivity(document);
    bindActivity(screensaver);           // moving over the dashboard dismisses it
    // frames already loaded before init get bound too
    ["dranken","allergenen","checklists","keukenchecklists","taken","table","labels","management","kiosk"].forEach(n => {
      const f = frame(n); if (f && f.src) attachFrameActivity(f);
    });
    idleTimer = setTimeout(autoShow, IDLE_MS);
    // Klik op het logo linksboven → screensaver meteen tonen.
    const trigger = document.getElementById("ssTrigger");
    if (trigger){
      const fire = e => { e.stopPropagation(); clearTimeout(idleTimer); showSaver(); };
      trigger.addEventListener("click", fire);
      trigger.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fire(e); });
    }
  }

  function startApp(){
    document.getElementById("loginGate").classList.add("hidden");
    shell.classList.add("show");
    let tab = "table";
    try { tab = localStorage.getItem("zusje_hub_tab") || "table"; } catch(e){}
    activate(tab);
    initIdle();
  }

  // Login
  const PASSWORD = "zusje2026";
  const input = document.getElementById("passwordInput");
  const errEl = document.getElementById("loginError");
  function unlock(){
    if (input.value === PASSWORD){
      errEl.classList.add("hidden");
      try { sessionStorage.setItem("zusje_hub_unlocked","1"); } catch(e){}
      startApp();
    } else {
      errEl.classList.remove("hidden");
    }
  }
  document.getElementById("loginBtn").addEventListener("click", unlock);
  input.addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

  let unlocked = false;
  try { unlocked = sessionStorage.getItem("zusje_hub_unlocked") === "1"; } catch(e){}
  if (unlocked) startApp();
})();

// Geen service worker meer: de SW-cachelaag hield op sommige apparaten oude
// versies vast. Bestaande registraties worden opgeruimd door sw.js (self-destruct)
// en hieronder, zodat er altijd rechtstreeks van het netwerk wordt geladen.
if ("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(r => r.unregister()))
    .catch(() => {});
  if (window.caches && caches.keys){
    caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
  }
}
</script>
</body>
</html>
