<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Drankenkaart</title>

<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drankenkaart">
<meta name="application-name" content="Drankenkaart">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">

<style>
:root{ --gold:#c8a45b; --bg:#111111; --bg2:#0b0b0b; }
html,body{margin:0;padding:0;background:var(--bg);color:#ffffff}
#dk-app,#dk-app *,#dk-app *::before,#dk-app *::after{
  box-sizing:border-box !important;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif !important;
  letter-spacing:normal !important;
  line-height:1.45 !important;
  color:#ffffff !important;
}
#dk-app{min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 56px}

/* Top bar */
.topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.lang{display:inline-flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:#ffffff !important;font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer}
.lang button.active{background:var(--gold);color:#0b0b0b !important}

.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px}
.brand img{width:92px;max-width:30vw;display:block}
.title{margin:0;text-align:center;font-size:26px;font-weight:600}
.subtitle{margin:2px 0 0;text-align:center;font-size:13px;color:#ffffff !important;opacity:.7}

/* Search */
.search-row{display:flex;gap:10px;align-items:center;max-width:560px;margin:18px auto 4px}
.search{flex:1;min-height:52px;border:1px solid var(--gold);border-radius:28px;padding:0 20px;font-size:16px;outline:none;background:var(--bg);color:#ffffff}
.search::placeholder{color:#ffffff !important;opacity:.55}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,91,.18)}

/* Tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 22px}
.tab{min-height:44px;padding:0 18px;border:1px solid var(--gold);border-radius:24px;background:var(--bg);color:#ffffff !important;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s ease}
.tab .count{font-size:12px;opacity:.65;font-weight:500}
.tab:hover{background:#1a1a1a}
.tab.active{background:var(--gold);color:#0b0b0b !important}
.tab.active *{color:#0b0b0b !important}

/* Tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tile{border:1px solid var(--gold);border-radius:16px;background:var(--bg);overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;transition:transform .12s ease, box-shadow .15s ease}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(200,164,91,.16)}
.tile:active{transform:translateY(0)}
.tile-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#0b0b0b;display:block}
.tile-body{padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.tile-cat{margin:0;font-size:10px;color:var(--gold) !important;text-transform:uppercase;letter-spacing:.5px !important;font-weight:600}
.tile-name{margin:0;font-size:14px;font-weight:600;line-height:1.3 !important}
.tile-steps{margin:0;font-size:12px;color:#ffffff !important;opacity:.5}

.empty{grid-column:1/-1;border:1px dashed var(--gold);border-radius:16px;padding:32px 16px;text-align:center;color:#ffffff !important;opacity:.8}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;opacity:0;pointer-events:none;transition:opacity .16s ease}
.overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--gold);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:translateY(12px) scale(.98);transition:transform .18s ease}
.overlay.open .modal{transform:translateY(0) scale(1)}
.modal-hero{position:relative}
.modal-hero img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#0b0b0b}
.modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top, rgba(17,17,17,1) 2%, rgba(17,17,17,0) 45%);pointer-events:none}
.close{position:absolute;top:12px;right:12px;width:38px;height:38px;border:1px solid var(--gold);background:rgba(11,11,11,.72);border-radius:999px;color:var(--gold) !important;font-size:22px;line-height:1 !important;cursor:pointer;display:grid;place-items:center;z-index:2}
.close:hover{background:#1a1a1a}
.modal-head{padding:4px 22px 12px;margin-top:-6px;position:relative;z-index:1}
.modal-cat{margin:0 0 4px;font-size:11px;color:var(--gold) !important;text-transform:uppercase;letter-spacing:.6px !important;font-weight:600}
.modal-title{margin:0;font-size:22px;font-weight:600;line-height:1.25 !important}
.modal-body{padding:8px 22px 26px}
.prep-label{margin:0 0 12px;font-size:12px;color:#ffffff !important;opacity:.6;text-transform:uppercase;letter-spacing:.5px !important;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:step}
.steps li{position:relative;padding-left:44px;font-size:15px;min-height:30px;display:flex;align-items:center}
.steps li::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:999px;background:var(--gold);color:#0b0b0b !important;font-weight:700;font-size:14px;display:grid;place-items:center}

.hidden{display:none !important}

@media (max-width:640px){
  .wrap{padding:16px 12px 40px}
  .title{font-size:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tab{min-height:42px;padding:0 15px;font-size:13px}
  .modal-head{padding:4px 18px 10px}
  .modal-body{padding:8px 18px 22px}
  .modal-title{font-size:20px}
}

/* Login gate */
#loginGate{min-height:100vh;background:var(--bg2);display:flex;align-items:center;justify-content:center;padding:24px}
.login-shell{width:100%;max-width:520px}
.login-card{border:1px solid var(--gold);background:var(--bg2);border-radius:24px;padding:28px 24px;box-shadow:0 14px 42px rgba(200,164,91,.12);text-align:center}
.login-logo{width:140px;max-width:42vw;display:block;margin:0 auto 18px}
.login-title{margin:0 0 18px;color:#ffffff !important;font-size:28px;font-weight:600}
.login-row{display:flex;gap:10px;align-items:center}
.login-input{flex:1;min-height:56px;border:1px solid var(--gold);border-radius:28px;padding:0 20px;font-size:16px;outline:none;background:var(--bg);color:#ffffff !important;box-shadow:0 8px 24px rgba(200,164,91,.12)}
.login-input::placeholder{color:#ffffff !important;opacity:.7}
.login-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,91,.18), 0 8px 24px rgba(200,164,91,.18)}
.login-btn{min-height:56px;padding:0 18px;border:1px solid var(--gold);border-radius:28px;background:var(--bg2);color:#ffffff !important;font-size:15px;font-weight:600;cursor:pointer}
.login-error{margin:12px 0 0;color:#ffffff !important;font-size:13px}
@media (max-width:640px){
  .login-card{padding:22px 18px;border-radius:20px}
  .login-title{font-size:24px}
  .login-row{flex-direction:column}
  .login-input,.login-btn{width:100%}
}
</style>
</head>

<body>
<div id="loginGate">
  <div class="login-shell">
    <div class="login-card">
      <img class="login-logo" src="logo.png" alt="Zusje logo">
      <h1 class="login-title">Inloggen</h1>
      <div class="login-row">
        <input id="passwordInput" class="login-input" type="password" placeholder="Wachtwoord" aria-label="Wachtwoord">
        <button id="loginBtn" class="login-btn" type="button">Open</button>
      </div>
      <p id="loginError" class="login-error hidden">Onjuist wachtwoord</p>
    </div>
  </div>
</div>

<div id="protectedApp" class="hidden">
<div id="dk-app">
  <div class="wrap">
    <div class="topbar">
      <div class="lang" role="group" aria-label="Taal / Language">
        <button id="langNL" type="button" data-lang="nl">NL</button>
        <button id="langEN" type="button" data-lang="en">EN</button>
      </div>
    </div>

    <div class="brand">
      <img src="logo.png" alt="Zusje logo">
      <div>
        <h1 class="title">Drankenkaart</h1>
        <p id="subtitle" class="subtitle"></p>
      </div>
    </div>

    <div class="search-row">
      <input id="q" class="search" type="text" aria-label="Zoek een drankje">
    </div>

    <nav id="tabs" class="tabs" aria-label="Categorieën"></nav>

    <div id="grid" class="grid"></div>
  </div>
</div>
</div>

<!-- Modal -->
<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-hero">
      <img id="modalImg" src="" alt="">
      <button id="modalClose" class="close" type="button" aria-label="Sluiten">×</button>
    </div>
    <div class="modal-head">
      <p id="modalCat" class="modal-cat"></p>
      <h2 id="modalTitle" class="modal-title"></h2>
    </div>
    <div class="modal-body">
      <p id="prepLabel" class="prep-label"></p>
      <ol id="modalSteps" class="steps"></ol>
    </div>
  </div>
</div>

<script>
const CAT_ORDER = ["Fris","Cocktails","Bier","Wijn","Sterke drank","Koffie en thee"];
const CAT_EN = {
  "Fris":"Soft drinks","Cocktails":"Cocktails","Bier":"Beer",
  "Wijn":"Wine","Sterke drank":"Spirits","Koffie en thee":"Coffee & tea"
};
const T = {
  nl:{ subtitle:"Zoek per drankje de bereidingswijze op", placeholder:"Zoek een drankje…",
       prep:"Bereidingswijze", step:"stap", steps:"stappen",
       empty:"Geen drankjes gevonden", emptyFor:"Geen drankjes gevonden voor" },
  en:{ subtitle:"Look up the preparation for each drink", placeholder:"Search a drink…",
       prep:"Preparation", step:"step", steps:"steps",
       empty:"No drinks found", emptyFor:"No drinks found for" }
};

let DATA = [];
let activeCat = CAT_ORDER[0];
let query = "";
let lang = localStorage.getItem("zusje_dranken_lang") || "nl";
let currentIdx = null;

fetch("data.json")
  .then(r => r.json())
  .then(d => { DATA = d; applyLang(); buildTabs(); render(); })
  .catch(e => { console.error("Kon data.json niet laden:", e); });

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalize(str){
  return (str||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
}
function dName(d){ return lang==="en" ? d.name_en : d.name; }
function dSteps(d){ return lang==="en" ? d.steps_en : d.steps; }
function catLabel(cat){ return lang==="en" ? CAT_EN[cat] : cat; }

function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById("langNL").classList.toggle("active", lang==="nl");
  document.getElementById("langEN").classList.toggle("active", lang==="en");
  document.getElementById("subtitle").textContent = T[lang].subtitle;
  document.getElementById("q").placeholder = T[lang].placeholder;
  document.getElementById("prepLabel").textContent = T[lang].prep;
}

function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = CAT_ORDER.map(cat => {
    const n = DATA.filter(d => d.category === cat).length;
    return `<button class="tab${cat===activeCat?' active':''}" type="button" data-cat="${escapeHtml(cat)}">
      <span class="lbl">${escapeHtml(catLabel(cat))}</span> <span class="count">${n}</span>
    </button>`;
  }).join("");
  tabsEl.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("click", () => {
      activeCat = b.dataset.cat;
      tabsEl.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.cat===activeCat));
      render();
    });
  });
}

function render(){
  const gridEl = document.getElementById("grid");
  const q = normalize(query);
  let list;
  if (q){
    list = DATA.filter(d => normalize(d.name).includes(q) || normalize(d.name_en).includes(q));
  } else {
    list = DATA.filter(d => d.category === activeCat);
  }

  if (!list.length){
    const msg = q ? `${T[lang].emptyFor} “${escapeHtml(query)}”.` : `${T[lang].empty}.`;
    gridEl.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  gridEl.innerHTML = list.map(d => {
    const idx = DATA.indexOf(d);
    const nSteps = d.steps.length;
    const stepWord = nSteps===1 ? T[lang].step : T[lang].steps;
    const showCat = q ? `<p class="tile-cat">${escapeHtml(catLabel(d.category))}</p>` : '';
    return `<button class="tile" type="button" onclick="openModal(${idx})">
      <img class="tile-img" src="${escapeHtml(d.img)}" alt="${escapeHtml(dName(d))}" loading="lazy">
      <div class="tile-body">
        ${showCat}
        <p class="tile-name">${escapeHtml(dName(d))}</p>
        <p class="tile-steps">${nSteps} ${stepWord}</p>
      </div>
    </button>`;
  }).join("");
}

function openModal(idx){
  const d = DATA[idx];
  if (!d) return;
  currentIdx = idx;
  document.getElementById("modalImg").src = d.img;
  document.getElementById("modalImg").alt = dName(d);
  document.getElementById("modalCat").textContent = catLabel(d.category);
  document.getElementById("modalTitle").textContent = dName(d);
  document.getElementById("prepLabel").textContent = T[lang].prep;
  document.getElementById("modalSteps").innerHTML = dSteps(d).map(s => `<li>${escapeHtml(s)}</li>`).join("");
  const ov = document.getElementById("overlay");
  ov.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
  currentIdx = null;
}

function setLang(l){
  lang = l;
  localStorage.setItem("zusje_dranken_lang", l);
  applyLang();
  buildTabs();
  render();
  if (currentIdx !== null) openModal(currentIdx);
}

document.getElementById("langNL").addEventListener("click", () => setLang("nl"));
document.getElementById("langEN").addEventListener("click", () => setLang("en"));
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
</script>

<script>
(function(){
  const CORRECT_PASSWORD = "zusje2026";
  const loginBtn = document.getElementById("loginBtn");
  const passwordInput = document.getElementById("passwordInput");
  const loginError = document.getElementById("loginError");
  const loginGate = document.getElementById("loginGate");
  const protectedApp = document.getElementById("protectedApp");

  function unlock(){
    if (passwordInput.value === CORRECT_PASSWORD){
      loginError.classList.add("hidden");
      loginGate.classList.add("hidden");
      protectedApp.classList.remove("hidden");
      sessionStorage.setItem("zusje_drankenkaart_unlocked", "1");
    } else {
      loginError.classList.remove("hidden");
    }
  }
  loginBtn.addEventListener("click", unlock);
  passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

  if (sessionStorage.getItem("zusje_drankenkaart_unlocked") === "1"){
    loginGate.classList.add("hidden");
    protectedApp.classList.remove("hidden");
  }
})();
</script>
</body>
</html>
