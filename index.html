<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Zusje App</title>

<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zusje">
<meta name="application-name" content="Zusje">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="shortcut icon" href="favicon.png">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --gold:#c8a45b; --gold-bright:#f0d28a; --gold-deep:#8a6a32;
  --bg:#0b0906; --bg2:#080604;
  --panel:rgba(24,19,12,.72); --panel-solid:#141009;
  --line:rgba(200,164,91,.28); --line-strong:rgba(200,164,91,.55);
  --txt:#f5f1e8; --muted:rgba(245,241,232,.55);
  --grad-gold:linear-gradient(180deg,#f4dc9c 0%,#d9b26a 55%,#c8a45b 100%);
  --shadow-gold:0 6px 20px -6px rgba(200,164,91,.45);
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;overflow:hidden;-webkit-font-smoothing:antialiased}

/* Sfeer-achtergrond: diep warm zwart met gouden gloed */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 90% 60% at 15% -10%, rgba(200,164,91,.13), transparent 55%),
    radial-gradient(ellipse 70% 55% at 100% 110%, rgba(200,164,91,.09), transparent 55%),
    linear-gradient(180deg,#0d0a07 0%,#0b0906 40%,#090705 100%)}

/* Shell */
#shell{display:none;flex-direction:column;height:100dvh;width:100%;position:relative;z-index:1}
#shell.show{display:flex}

/* Bovenbalk: donker glas */
.tabbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right));
  padding-top:calc(10px + env(safe-area-inset-top));
  background:
    linear-gradient(90deg, rgba(5,8,6,.62) 0%, rgba(5,8,6,.26) 30%, rgba(5,8,6,.26) 70%, rgba(5,8,6,.62) 100%),
    linear-gradient(180deg, rgba(4,7,5,.36), rgba(4,7,5,.55)),
    url("banner.jpg") center 42% / cover no-repeat;
  border-bottom:1px solid var(--line);position:relative;z-index:5;
  box-shadow:0 8px 32px -12px rgba(0,0,0,.8), inset 0 1px 0 rgba(240,210,138,.14)}
.tabbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(240,210,138,.5) 50%,transparent 100%);pointer-events:none}
.tabbar .logo{height:34px;width:auto;display:block;flex:0 0 auto;
  filter:drop-shadow(0 2px 8px rgba(200,164,91,.35))}

/* Dashboard-knop (logo) */
.logobtn{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;margin-right:2px;padding:4px 12px 4px 4px;
  background:linear-gradient(180deg,rgba(38,30,17,.9),rgba(15,11,7,.92));
  border:1px solid var(--line);border-radius:999px;cursor:pointer;
  transition:all .2s var(--ease)}
.logobtn:hover{background:linear-gradient(180deg,rgba(52,41,22,.94),rgba(20,15,9,.94));
  border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow-gold)}
.logobtn:active{transform:translateY(0) scale(.98)}
.logobtn-txt{font-size:13.5px;font-weight:600;letter-spacing:.02em;line-height:1;white-space:nowrap;padding-right:2px;
  background:var(--grad-gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* Hoofdtabs */
.tabs{display:flex;gap:8px;flex:1;justify-content:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:3px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;flex:0 0 auto;position:relative;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(24,19,11,.86),rgba(13,10,6,.9));color:var(--txt);
  box-shadow:0 4px 14px -6px rgba(0,0,0,.55);
  font-family:inherit;font-size:14.5px;font-weight:600;letter-spacing:.01em;padding:10px 22px;border-radius:999px;cursor:pointer;
  transition:all .2s var(--ease);white-space:nowrap}
.tab:hover{border-color:var(--line-strong);background:linear-gradient(180deg,rgba(46,37,20,.92),rgba(20,15,9,.92));
  transform:translateY(-1px)}
.tab:active{transform:translateY(0) scale(.98)}
.tab.active{background:var(--grad-gold);color:#241a0c;border-color:transparent;
  box-shadow:var(--shadow-gold),inset 0 1px 0 rgba(255,255,255,.5)}

/* Rechtsboven */
.tablink{width:40px;height:40px;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;
  background:transparent;color:var(--gold);display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:17px;
  transition:all .2s var(--ease)}
.tablink:hover{background:rgba(200,164,91,.12);border-color:var(--line-strong);transform:translateY(-1px)}
.minibtn{flex:0 0 auto;border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,19,11,.86),rgba(13,10,6,.9));color:var(--gold);font-family:inherit;
  font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:all .2s var(--ease)}
.minibtn:hover{background:rgba(200,164,91,.12);border-color:var(--line-strong);transform:translateY(-1px)}
.minibtn:active{transform:scale(.96)}
.minibtn-ico{display:inline-flex;align-items:center;justify-content:center;padding:0;width:40px;height:40px;border-radius:999px}
.minibtn-ico svg{display:block}
.minibtn.active{background:var(--grad-gold);color:#241a0c;border-color:transparent;box-shadow:var(--shadow-gold)}
.sitebtn{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--gold);font-family:inherit;
  font-size:12.5px;font-weight:600;letter-spacing:.03em;padding:8px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:all .2s var(--ease)}
.sitebtn:hover{background:linear-gradient(180deg,rgba(46,37,20,.92),rgba(20,15,9,.92));border-color:var(--line-strong);transform:translateY(-1px)}

/* Kiosk-knop */
.tab-kiosk{display:inline-flex;align-items:center;gap:8px;padding-left:13px}
.tab-logo{width:19px;height:19px;object-fit:contain;display:block;flex:0 0 auto;border-radius:4px}

/* Subtabs */
.subtabs{flex:0 0 auto;background:rgba(10,8,5,.75);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(200,164,91,.16);
  padding:8px max(14px,env(safe-area-inset-left));position:relative;z-index:4}
.subtabs.hidden{display:none}
.subrow{display:flex;gap:7px;justify-content:center;overflow-x:auto;scrollbar-width:none}
.subrow::-webkit-scrollbar{display:none}
.subrow.hidden{display:none}
.subtab{appearance:none;flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 17px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:all .2s var(--ease)}
.subtab:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.subtab.active{background:rgba(200,164,91,.16);color:var(--gold-bright);border-color:var(--line);
  box-shadow:inset 0 1px 0 rgba(240,210,138,.15)}

/* Werkvlak */
.stage{flex:1 1 auto;position:relative;background:transparent}
.kioskhint{position:absolute;top:0;left:0;right:0;z-index:3;display:none;align-items:center;justify-content:center;gap:8px;
  background:rgba(10,8,5,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);color:var(--txt);font-size:13px;line-height:1.35;
  padding:10px 46px 10px 16px;text-align:center}
.kioskhint.show{display:flex}
.kioskhint b{color:var(--gold-bright)}
.kioskhint .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:1px solid var(--line);
  background:transparent;color:var(--gold);border-radius:999px;font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:all .15s var(--ease)}
.kioskhint .x:hover{background:rgba(200,164,91,.15)}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.frame.active{display:block;animation:frameIn .25s var(--ease)}
@keyframes frameIn{from{opacity:0}to{opacity:1}}

/* Screensaver */
#screensaver{position:fixed;inset:0;z-index:100;background:#000;display:none}
#screensaver.show{display:block}
#screensaver iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.frameholder{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--txt);opacity:.6;font-size:14px;text-align:center;padding:24px}
.frameholder.active{display:flex}

@media (max-width:560px){
  .tab{font-size:13px;padding:9px 15px}
  .tabbar .logo{height:28px}
  .tablink{width:38px;height:38px}
  .tabbar{gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap}
  .tabbar::-webkit-scrollbar{display:none}
  .tabs{flex:0 0 auto;justify-content:flex-start;overflow:visible;padding:0}
  .logobtn,.minibtn,.tablink{flex:0 0 auto}
  .logobtn{padding:3px 10px 3px 3px;gap:5px}
  .logobtn-txt{font-size:12px}
  .minibtn{font-size:11.5px;padding:7px 11px}
  .subrow{justify-content:flex-start}
  .subtab{font-size:12.5px;padding:8px 14px}
  .tab-logo{width:17px;height:17px}
  .kioskhint{font-size:12px;padding:8px 42px 8px 12px}
}

/* Vestigingskeuze en login: cinematisch entree */
#siteGate,#loginGate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(ellipse 100% 70% at 50% -20%, rgba(200,164,91,.16), transparent 60%),
    linear-gradient(180deg,#0d0a07,#080604)}
#siteGate{z-index:12}
#loginGate{z-index:10}
#siteGate.hidden,#loginGate.hidden{display:none}
.login-shell{width:100%;max-width:440px;animation:gateIn .5s var(--ease)}
@keyframes gateIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.login-card{position:relative;border:1px solid var(--line);border-radius:28px;padding:40px 32px 32px;text-align:center;
  background:linear-gradient(180deg,rgba(28,22,14,.85),rgba(16,12,8,.92));
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  box-shadow:0 30px 80px -20px rgba(0,0,0,.8),0 0 60px -20px rgba(200,164,91,.25),inset 0 1px 0 rgba(240,210,138,.12)}
.login-card::before{content:"";position:absolute;left:15%;right:15%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(240,210,138,.7),transparent)}
.login-logo{width:120px;max-width:38vw;display:block;margin:0 auto 22px;
  filter:drop-shadow(0 6px 24px rgba(200,164,91,.45))}
.login-title{margin:0 0 22px;font-size:26px;font-weight:650;letter-spacing:-.01em}
.login-site{margin:-14px 0 20px;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-bright)}
.login-row{display:flex;gap:10px;align-items:center}
.login-input{flex:1;min-width:0;min-height:56px;border:1px solid var(--line);border-radius:999px;padding:0 22px;font-size:16px;
  font-family:inherit;outline:none;background:rgba(0,0,0,.35);color:var(--txt);transition:all .2s var(--ease)}
.login-input::placeholder{color:var(--muted)}
.login-input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,164,91,.18),0 0 24px -6px rgba(200,164,91,.4)}
.login-btn{min-height:56px;padding:0 26px;border:none;border-radius:999px;background:var(--grad-gold);color:#241a0c;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow-gold),inset 0 1px 0 rgba(255,255,255,.5);transition:all .2s var(--ease)}
.login-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.login-btn:active{transform:scale(.97)}
.login-error{margin:14px 0 0;font-size:13px;color:#ff9b9b}
.site-list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.site-btn{width:100%;min-height:60px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));color:var(--txt);
  font-family:inherit;font-size:17px;font-weight:650;letter-spacing:.01em;cursor:pointer;transition:all .2s var(--ease)}
.site-btn:hover{border-color:var(--gold);background:linear-gradient(180deg,rgba(200,164,91,.16),rgba(200,164,91,.05));
  transform:translateY(-2px);box-shadow:var(--shadow-gold)}
.site-btn:active{transform:scale(.98)}
.site-note{margin:18px 0 0;font-size:12.5px;color:var(--muted)}
.hidden{display:none !important}
@media (max-width:560px){
  .login-card{padding:32px 22px 26px;border-radius:24px}
  .login-title{font-size:22px}
  .login-row{flex-direction:column}
  .login-input,.login-btn{width:100%}
}
</style>
</head>
<body>

<!-- Vestigingskeuze -->
<div id="siteGate">
  <div class="login-shell">
    <div class="login-card">
      <img class="login-logo" src="logo.png" alt="Zusje logo">
      <h1 class="login-title">Kies je vestiging</h1>
      <div id="siteList" class="site-list"></div>
      <p class="site-note">Je keuze wordt op dit apparaat onthouden.</p>
    </div>
  </div>
</div>

<!-- Login -->
<div id="loginGate">
  <div class="login-shell">
    <div class="login-card">
      <img class="login-logo" src="logo.png" alt="Zusje logo">
      <h1 class="login-title" id="loginTitle">Inloggen</h1>
      <p class="login-site" id="loginSite"></p>
      <div class="login-row">
        <input id="passwordInput" class="login-input" type="password" placeholder="Wachtwoord" aria-label="Wachtwoord">
        <button id="loginBtn" class="login-btn" type="button">Open</button>
      </div>
      <p id="loginError" class="login-error hidden">Onjuist wachtwoord</p>
    </div>
  </div>
</div>

<!-- App shell -->
<div id="shell">
  <header class="tabbar">
    <button id="ssTrigger" class="logobtn" type="button" title="Dashboard tonen" aria-label="Dashboard tonen">
      <img class="logo" src="logo.png" alt="Zusje">
      <span class="logobtn-txt">Dashboard</span>
    </button>
    <nav class="tabs" role="tablist" aria-label="Onderdelen">
      <button class="tab active" type="button" data-group="bediening">Bediening</button>
      <button class="tab" type="button" data-group="keuken">Keuken</button>
      <button class="tab tab-kiosk" type="button" role="tab" data-tab="kiosk" title="Kiosk">
        <img src="shiftbase-logo.webp" alt="" class="tab-logo"><span>Kiosk</span>
      </button>
    </nav>
    <button id="siteBtn" class="sitebtn" type="button" title="Van vestiging wisselen">Roermond</button>
    <button id="mgmtBtn" class="minibtn minibtn-ico" type="button" data-tab="management" title="Management" aria-label="Management"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></button>
    <a id="kioskOpen" class="tablink hidden" href="https://kiosk.shiftbase.com/" target="_blank" rel="noopener" title="Kiosk in nieuw tabblad openen" aria-label="Kiosk in nieuw tabblad openen">↗</a>
  </header>

  <nav class="subtabs" id="subtabs" aria-label="Onderdelen binnen categorie">
    <div class="subrow" data-subrow="bediening">
      <button class="subtab active" type="button" data-tab="table">Tafeloverzicht</button>
      <button class="subtab" type="button" data-tab="checklists">Checklists</button>
      <button class="subtab" type="button" data-tab="dranken">Dranken</button>
      <button class="subtab" type="button" data-tab="reserveringen">Reserveringen ↗</button>
    </div>
    <div class="subrow hidden" data-subrow="keuken">
      <button class="subtab" type="button" data-tab="allergenen">Allergenen</button>
      <button class="subtab" type="button" data-tab="keukenchecklists">Checklists</button>
      <button class="subtab" type="button" data-tab="labels">Labels</button>
    </div>
  </nav>

  <main class="stage">
    <div id="kioskHint" class="kioskhint">
      <span>Eenmalig inloggen op dit apparaat — <b>Account&nbsp;ID</b>&nbsp;105540&nbsp;&nbsp;·&nbsp;&nbsp;<b>Kiosk&nbsp;code</b>&nbsp;gr3gh. Daarna blijft de kiosk ingelogd.</span>
      <button id="kioskHintClose" class="x" type="button" aria-label="Sluiten">×</button>
    </div>
    <iframe id="f-dranken"    class="frame active" title="Dranken"    data-src="dranken/index.html"></iframe>
    <iframe id="f-allergenen" class="frame"        title="Allergenen" data-src="allergenen/index.html"></iframe>
    <iframe id="f-checklists" class="frame"        title="Checklists" data-src="checklists/index.html"></iframe>
    <iframe id="f-keukenchecklists" class="frame" title="Keukenchecklists" data-src="keukenchecklists/index.html"></iframe>
    <iframe id="f-taken"      class="frame"        title="Taken & agenda" data-src="taken/index.html"></iframe>
    <iframe id="f-table"      class="frame"        title="Table"      data-src="table/index.html"></iframe>
    <iframe id="f-labels"     class="frame"        title="Labels"     data-src="https://desktop-o25ac4v.tail7db321.ts.net/" referrerpolicy="no-referrer"></iframe>
    <iframe id="f-management" class="frame"        title="Management" data-src="management/index.html"></iframe>
    <iframe id="f-kiosk"      class="frame"        title="Kiosk"      data-src="https://kiosk.shiftbase.com/"
            allow="camera; microphone; fullscreen; geolocation; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </main>
</div>

<!-- Screensaver overlay (dashboard) -->
<div id="screensaver" aria-hidden="true">
  <iframe id="f-screensaver" title="Dashboard" data-src="https://sjorsgofers.github.io/monitor-dashboard/"
          allow="fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
(function(){
  const TABS = ["dranken","allergenen","checklists","keukenchecklists","taken","table","labels","management","kiosk"];
  // Welke pagina's onder welke hoofdcategorie vallen (eerste = standaard)
  const GROUPS = { bediening:["table","checklists","dranken","reserveringen"], keuken:["allergenen","keukenchecklists","labels"] };
  function groupOf(tab){
    for (const g in GROUPS) if (GROUPS[g].includes(tab)) return g;
    return null;
  }
  const RESERVERINGEN_URL = "https://zusje.reserveersysteem.eu/contao?do=restaurant_dashboard&restaurant=1009";
  let currentTab = "table";
  const shell = document.getElementById("shell");

  function frame(name){ return document.getElementById("f-"+name); }
  function ensureLoaded(name){
    const f = frame(name);
    if (f && f.dataset.src && !f.src){
      f.addEventListener("load", () => attachFrameActivity(f), { once:true });
      f.src = withSite(f.dataset.src);
    }
  }

  // Beveiligde pagina's altijd opnieuw op slot bij een tabwissel, zodat een
  // openstaande pc niet toegankelijk blijft.
  const LOCKED_TABS = ["management","taken"];
  function lockSecureTabs(){
    LOCKED_TABS.forEach(t => {
      const f = frame(t);
      if (f && f.src && f.contentWindow){
        try { f.contentWindow.postMessage({ type:"zusjeLock" }, "*"); } catch(e){}
      }
    });
  }

  function activate(name){
    if (!TABS.includes(name)) name = "table";
    lockSecureTabs();
    currentTab = name;
    ensureLoaded(name);
    TABS.forEach(t => {
      const f = frame(t);
      if (f) f.classList.toggle("active", t===name);
      const tb = document.querySelector('.tab[data-tab="'+t+'"]');
      if (tb) tb.classList.toggle("active", t===name);
      const mb = document.querySelector('.minibtn[data-tab="'+t+'"]');
      if (mb) mb.classList.toggle("active", t===name);
    });
    // Hoofdcategorie + subtabs bijwerken
    const g = groupOf(name);
    document.querySelectorAll('.tab[data-group]').forEach(b => b.classList.toggle("active", b.dataset.group===g));
    document.querySelectorAll('.subrow').forEach(r => r.classList.toggle("hidden", r.dataset.subrow!==g));
    document.getElementById("subtabs").classList.toggle("hidden", !g);
    document.querySelectorAll('.subtab').forEach(b => b.classList.toggle("active", b.dataset.tab===name));
    document.getElementById("kioskOpen").classList.toggle("hidden", name!=="kiosk");
    updateKioskHint(name);
    try { localStorage.setItem("zusje_hub_tab", name); } catch(e){}
  }

  // Kleine knop naast het logo (Taken & agenda)
  document.querySelectorAll(".minibtn").forEach(b => {
    b.addEventListener("click", () => openTab(b.dataset.tab));
  });

  // Subtabs binnen een categorie
  document.querySelectorAll(".subtab").forEach(b => {
    b.addEventListener("click", () => openTab(b.dataset.tab));
  });

  // Management-pagina kan de shell vragen naar een ander tabblad te springen
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (d && d.type === "zusjeGoTab" && typeof d.tab === "string") openTab(d.tab);
  });

  function hintDismissed(){
    try { return localStorage.getItem("zusje_kiosk_hint_dismissed") === "1"; } catch(e){ return false; }
  }
  function updateKioskHint(name){
    const hint = document.getElementById("kioskHint");
    hint.classList.toggle("show", name==="kiosk" && !hintDismissed());
  }
  document.getElementById("kioskHintClose").addEventListener("click", () => {
    try { localStorage.setItem("zusje_kiosk_hint_dismissed","1"); } catch(e){}
    document.getElementById("kioskHint").classList.remove("show");
  });

  function openTab(tab){
    if (tab === "reserveringen"){ window.open(RESERVERINGEN_URL, "_blank", "noopener"); return; }
    activate(tab);
  }
  // Hoofdknoppen: categorie opent zijn eerste pagina, losse knoppen openen zichzelf
  document.querySelectorAll(".tab").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.group){
        const list = GROUPS[b.dataset.group] || [];
        const active = list.find(t => t === currentTab);
        openTab(active || list[0]);
        return;
      }
      openTab(b.dataset.tab);
    });
  });

  /* ---------- Screensaver / idle ---------- */
  const IDLE_MS = 60000;                 // 1 minuut
  const ACT_EVENTS = ["mousemove","mousedown","keydown","touchstart","wheel","scroll"];
  const screensaver = document.getElementById("screensaver");
  let idleTimer = null;
  let saverOn = false;
  let idleReady = false;
  let saverShownAt = 0;   // gratieperiode: negeer (synthetische) events vlak na tonen

  function showSaver(){
    const f = document.getElementById("f-screensaver");
    if (f && f.dataset.src && !f.src) f.src = f.dataset.src;
    screensaver.classList.add("show");
    screensaver.setAttribute("aria-hidden","false");
    saverOn = true;
    saverShownAt = Date.now();
  }
  function hideSaver(){
    screensaver.classList.remove("show");
    screensaver.setAttribute("aria-hidden","true");
    saverOn = false;
    // Fullscreen weer verlaten als we die zelf hadden aangezet
    try{
      if (document.fullscreenElement || document.webkitFullscreenElement){
        const ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (ex){ const r = ex.call(document); if (r && r.catch) r.catch(()=>{}); }
      }
    }catch(_){}
  }
  // Automatisch tonen — nooit op het Table-tabblad.
  function autoShow(){
    // Nooit automatisch op het Table-tabblad of op managementpagina's
    // (wachtwoordvergrendeld werk mag niet onderbroken worden).
    if (currentTab === "table" || currentTab === "management" || currentTab === "taken") return;
    showSaver();
  }
  function onActivity(){
    if (!idleReady) return;
    if (saverOn){
      // Fullscreen-overgang veroorzaakt synthetische mousemove/scroll-events
      // die de saver direct zouden sluiten — 1,5 s negeren na tonen.
      if (Date.now() - saverShownAt < 1500) return;
      hideSaver();
    }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(autoShow, IDLE_MS);
  }
  function bindActivity(target){
    if (!target) return;
    ACT_EVENTS.forEach(ev => {
      try { target.addEventListener(ev, onActivity, { passive:true }); } catch(e){}
    });
  }
  // Interaction inside a same-origin sub-app iframe also counts as activity.
  function attachFrameActivity(f){
    try { bindActivity(f.contentDocument); } catch(e){ /* cross-origin (kiosk): ignore */ }
  }
  function initIdle(){
    if (idleReady) return;
    idleReady = true;
    bindActivity(document);
    bindActivity(screensaver);           // moving over the dashboard dismisses it
    // frames already loaded before init get bound too
    ["dranken","allergenen","checklists","keukenchecklists","taken","table","labels","management","kiosk"].forEach(n => {
      const f = frame(n); if (f && f.src) attachFrameActivity(f);
    });
    idleTimer = setTimeout(autoShow, IDLE_MS);
    // Klik op het logo linksboven → screensaver meteen tonen.
    const trigger = document.getElementById("ssTrigger");
    if (trigger){
      const fire = e => {
        e.stopPropagation();
        clearTimeout(idleTimer);
        // Handmatig het dashboard tonen => ook fullscreen, zodat het scherm
        // helemaal gevuld is (browserbalken weg).
        try{
          const el = document.documentElement;
          const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (req && !document.fullscreenElement && !document.webkitFullscreenElement){
            const r = req.call(el);
            if (r && r.catch) r.catch(()=>{});   // door de browser geweigerd: gewoon doorgaan
          }
        }catch(_){}
        showSaver();
      };
      trigger.addEventListener("click", fire);
      trigger.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fire(e); });
    }
  }

  function startApp(){
    document.getElementById("siteGate").classList.add("hidden");
    document.getElementById("loginGate").classList.add("hidden");
    shell.classList.add("show");
    let tab = "table";
    try { tab = localStorage.getItem("zusje_hub_tab") || "table"; } catch(e){}
    activate(tab);
    initIdle();
  }

  /* ===== Vestigingen =====
     Elke vestiging heeft eigen checklists en agenda (via ?loc= naar de sub-apps)
     en een eigen wachtwoord. De keuze wordt op het apparaat onthouden. */
  const SITES = {
    roermond:   { naam:"Roermond",   wachtwoord:"Roerkade123" },
    maastricht: { naam:"Maastricht", wachtwoord:"Vrijthof123" }
  };
  const SITE_KEY = "zusje_site", AUTH_KEY = "zusje_auth";

  function savedSite(){
    try { const s = localStorage.getItem(SITE_KEY); return SITES[s] ? s : null; } catch(e){ return null; }
  }
  function currentSite(){ return savedSite() || "roermond"; }
  function siteName(){ return SITES[currentSite()].naam; }

  // Sub-apps krijgen de vestiging mee als ?loc=<vestiging>
  const APP_VERSION = "2026-08-22i";   // ophogen bij elke deploy => verse sub-apps, nooit uit cache
  function withSite(src){
    if (!src || /^https?:\/\//.test(src)) return src;   // externe pagina's ongemoeid
    const sep = src.includes("?") ? "&" : "?";
    return src + sep + "loc=" + currentSite() + "&v=" + APP_VERSION;
  }

  const siteGate = document.getElementById("siteGate");
  const loginGate = document.getElementById("loginGate");

  function toonVestigingskeuze(){
    const lijst = document.getElementById("siteList");
    lijst.innerHTML = "";
    Object.keys(SITES).forEach(key=>{
      const b = document.createElement("button");
      b.className = "site-btn"; b.type = "button";
      b.textContent = SITES[key].naam;
      b.addEventListener("click", ()=> kiesVestiging(key));
      lijst.appendChild(b);
    });
    siteGate.classList.remove("hidden");
    loginGate.classList.add("hidden");
    shell.classList.remove("show");
  }

  function kiesVestiging(key){
    const gewisseld = savedSite() !== key;
    try { localStorage.setItem(SITE_KEY, key); } catch(e){}
    // Bij het wisselen van vestiging opnieuw inloggen
    try { localStorage.removeItem(AUTH_KEY); } catch(e){}
    // Alle sub-apps leegmaken zodat ze straks met de NIEUWE vestiging laden
    if (gewisseld){
      TABS.forEach(t => {
        const f = frame(t);
        if (f && f.dataset.src) { f.removeAttribute("src"); }
      });
      try { localStorage.removeItem("zusje_hub_tab"); } catch(e){}
      currentTab = "table";
    }
    siteGate.classList.add("hidden");
    toonLogin();
  }

  function toonLogin(){
    document.getElementById("loginSite").textContent = siteName();
    const b = document.getElementById("siteBtn");
    if (b) b.textContent = siteName();
    loginGate.classList.remove("hidden");
    setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 100);
  }

  // Login (wachtwoord per vestiging)
  const input = document.getElementById("passwordInput");
  const errEl = document.getElementById("loginError");
  function unlock(){
    if (input.value === SITES[currentSite()].wachtwoord){
      errEl.classList.add("hidden");
      input.value = "";
      try { localStorage.setItem(AUTH_KEY, currentSite()); } catch(e){}
      startApp();
    } else {
      errEl.classList.remove("hidden");
    }
  }
  document.getElementById("loginBtn").addEventListener("click", unlock);
  input.addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

  // Klik op de vestigingsnaam in de balk => opnieuw kiezen
  const siteBtn = document.getElementById("siteBtn");
  if (siteBtn) siteBtn.addEventListener("click", toonVestigingskeuze);

  // Opstart: eerst vestiging, dan wachtwoord (beide worden onthouden)
  (function start(){
    const site = savedSite();
    if (!site){ toonVestigingskeuze(); return; }
    document.getElementById("siteBtn").textContent = siteName();
    let ingelogd = false;
    try { ingelogd = localStorage.getItem(AUTH_KEY) === site; } catch(e){}
    siteGate.classList.add("hidden");
    if (ingelogd) startApp(); else toonLogin();
  })();
})();

// Geen service worker meer: de SW-cachelaag hield op sommige apparaten oude
// versies vast. Bestaande registraties worden opgeruimd door sw.js (self-destruct)
// en hieronder, zodat er altijd rechtstreeks van het netwerk wordt geladen.
if ("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(r => r.unregister()))
    .catch(() => {});
  if (window.caches && caches.keys){
    caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
  }
}
</script>
